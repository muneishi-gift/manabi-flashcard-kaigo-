<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>介護用語フラッシュカード｜一般社団法人GIFT協会</title>
<meta name="description" content="介護福祉士試験対策 多言語フラッシュカード - 日本語・インドネシア語・ベトナム語・タイ語対応">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans:wght@400;700&family=Poppins:wght@600;800&display=swap" rel="stylesheet">

<style>
/* ========================================
   リセット＆ベース
   ======================================== */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans JP','Noto Sans',sans-serif;
  min-height:100dvh;
  display:flex;flex-direction:column;
  transition:background .5s ease,color .5s ease;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* ========================================
   カラーテーマ（言語別）
   ======================================== */
body.lang-ja{
  background:linear-gradient(160deg,#fce4ec 0%,#f8bbd0 40%,#f48fb1 100%);
  --accent:#c62828;--accent-rgb:198,40,40;--accent-light:#ffcdd2;
  --accent-glow:rgba(198,40,40,.1);--card-bg:#ffffff;--text:#b71c1c;
  --btn-ok:#c62828;--btn-again:#455a64;--surface:#fff5f5;
}
body.lang-id{
  background:linear-gradient(160deg,#e8f5e9 0%,#c8e6c9 40%,#a5d6a7 100%);
  --accent:#2e7d32;--accent-rgb:46,125,50;--accent-light:#c8e6c9;
  --accent-glow:rgba(46,125,50,.15);--card-bg:#ffffff;--text:#1b5e20;
  --btn-ok:#43a047;--btn-again:#e53935;--surface:#f1f8e9;
}
body.lang-vi{
  background:linear-gradient(160deg,#fff3e0 0%,#ffe0b2 40%,#ffcc80 100%);
  --accent:#e65100;--accent-rgb:230,81,0;--accent-light:#ffcc80;
  --accent-glow:rgba(230,81,0,.12);--card-bg:#ffffff;--text:#bf360c;
  --btn-ok:#f57c00;--btn-again:#c62828;--surface:#fff8e1;
}
body.lang-th{
  background:linear-gradient(160deg,#e3f2fd 0%,#bbdefb 40%,#90caf9 100%);
  --accent:#1565c0;--accent-rgb:21,101,192;--accent-light:#bbdefb;
  --accent-glow:rgba(21,101,192,.12);--card-bg:#ffffff;--text:#0d47a1;
  --btn-ok:#1976d2;--btn-again:#c62828;--surface:#e3f2fd;
}

/* ========================================
   ランディングページ
   ======================================== */
.landing{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100dvh;gap:20px;padding:32px 20px;
  background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
  color:#fff;text-align:center;position:relative;overflow:hidden;
}
.landing::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(120,100,255,.15) 0%,transparent 60%),
             radial-gradient(ellipse at 70% 80%,rgba(255,120,200,.1) 0%,transparent 60%);
  pointer-events:none;
}
.landing>*{position:relative;z-index:1}

.brand{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:8px}
.brand-logo{font-size:3rem;filter:drop-shadow(0 4px 12px rgba(255,255,255,.2));animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.brand h1{
  font-family:'Poppins','Noto Sans JP',sans-serif;
  font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800;
  letter-spacing:-.02em;
  background:linear-gradient(90deg,#a78bfa,#60a5fa,#34d399);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.brand-sub{font-size:clamp(.85rem,2.5vw,1rem);opacity:.7;font-weight:300}
.landing-desc{
  font-size:clamp(.95rem,2.8vw,1.15rem);opacity:.85;
  max-width:520px;line-height:1.7;font-weight:300;
}

/* ボタングリッド */
.lang-section{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:8px;width:100%;max-width:520px}

/* 日本語ボタン（日の丸デザイン） */
.lang-btn-ja{
  display:flex;align-items:center;justify-content:center;gap:16px;
  width:100%;max-width:480px;padding:22px 24px;border-radius:24px;
  border:2px solid rgba(255,255,255,.2);cursor:pointer;
  font-size:1rem;font-weight:700;color:#fff;
  transition:transform .25s,box-shadow .25s,border-color .25s;
  font-family:'Noto Sans JP',sans-serif;position:relative;overflow:hidden;
  backdrop-filter:blur(8px);background:transparent;
}
.lang-btn-ja::before{
  content:'';position:absolute;inset:0;border-radius:22px;z-index:0;
  background:linear-gradient(135deg,#f5f5f5 0%,#e0e0e0 100%);opacity:.92;
}
.lang-btn-ja>*{position:relative;z-index:1}
.lang-btn-ja:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 12px 32px rgba(0,0,0,.3);border-color:rgba(255,255,255,.4)}
.lang-btn-ja:active{transform:scale(.97)}
.hinomaru{
  width:52px;height:52px;border-radius:50%;
  background:radial-gradient(circle,#c62828 0%,#b71c1c 60%,#d32f2f 100%);
  box-shadow:0 0 16px rgba(198,40,40,.4),inset 0 -2px 4px rgba(0,0,0,.1);
  flex-shrink:0;
}
.ja-text{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.ja-text .lang-main{font-size:1.3rem;font-weight:900;color:#333}
.ja-text .lang-sub{font-size:.8rem;color:#888;font-weight:400}

/* 3言語ボタン */
.lang-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:100%}
.lang-btn{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  flex:1;min-width:140px;max-width:180px;padding:24px 14px;border-radius:24px;
  border:2px solid rgba(255,255,255,.15);cursor:pointer;
  font-size:1rem;font-weight:700;color:#fff;
  transition:transform .25s,box-shadow .25s,border-color .25s;
  font-family:'Noto Sans JP',sans-serif;position:relative;overflow:hidden;
  backdrop-filter:blur(8px);
}
.lang-btn::before{
  content:'';position:absolute;inset:0;opacity:.85;border-radius:22px;z-index:0;
  transition:opacity .3s;
}
.lang-btn>*{position:relative;z-index:1}
.lang-btn.id::before{background:linear-gradient(135deg,#43a047,#2e7d32)}
.lang-btn.vi::before{background:linear-gradient(135deg,#ff8f00,#e65100)}
.lang-btn.th::before{background:linear-gradient(135deg,#42a5f5,#1565c0)}
.lang-btn:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 12px 32px rgba(0,0,0,.35);border-color:rgba(255,255,255,.4)}
.lang-btn:active{transform:scale(.96)}
.lang-btn .flag{font-size:2.2rem;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.lang-btn .lang-name{font-size:.95rem;font-weight:700}
.lang-btn .lang-label{font-size:.75rem;opacity:.8;font-weight:400}

/* 操作説明 */
.how-to{
  margin-top:6px;padding:14px 20px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:14px;backdrop-filter:blur(6px);
  max-width:480px;width:100%;
}
.how-to p{
  font-size:clamp(.78rem,2.2vw,.88rem);opacity:.75;
  line-height:1.6;font-weight:300;
}
.how-to .icon{font-size:1rem;vertical-align:middle;margin-right:2px}

/* クレジット */
.credit{
  margin-top:20px;padding:16px 24px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:16px;backdrop-filter:blur(8px);
  text-align:center;
}
.credit-org{
  font-family:'Poppins','Noto Sans JP',sans-serif;
  font-size:clamp(.8rem,2.2vw,.95rem);font-weight:600;
  letter-spacing:.04em;
  background:linear-gradient(90deg,#ffd54f,#ffb300);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.credit-name{
  font-size:clamp(.95rem,2.8vw,1.15rem);font-weight:700;
  color:#fff;margin-top:2px;letter-spacing:.03em;
}
.credit-title{font-size:.75rem;opacity:.5;margin-top:4px}

/* ========================================
   ヘッダー
   ======================================== */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;
  background:var(--accent);color:#fff;
  box-shadow:0 2px 12px rgba(var(--accent-rgb),.3);
  position:sticky;top:0;z-index:100;
}
header h2{font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:6px}
.header-btns{display:flex;gap:6px}
.hbtn{
  background:rgba(255,255,255,.18);border:none;color:#fff;
  padding:6px 12px;border-radius:20px;cursor:pointer;
  font-size:.8rem;font-weight:700;transition:background .2s;
  font-family:'Noto Sans JP',sans-serif;
}
.hbtn:hover{background:rgba(255,255,255,.32)}

/* ========================================
   プログレスバー
   ======================================== */
.progress-area{padding:10px 16px 4px}
.progress-row{display:flex;align-items:center;gap:10px}
.progress-bar{flex:1;height:10px;background:var(--accent-light);border-radius:10px;overflow:hidden;position:relative}
.progress-fill{
  height:100%;border-radius:10px;
  background:linear-gradient(90deg,var(--accent),rgba(var(--accent-rgb),.7));
  transition:width .5s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.progress-fill::after{
  content:'';position:absolute;right:0;top:0;bottom:0;width:20px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4));
  border-radius:10px;
}
.progress-pct{
  font-size:.85rem;font-weight:700;color:var(--accent);
  min-width:42px;text-align:right;
}
.progress-text{font-size:.72rem;color:var(--text);text-align:center;opacity:.5;margin-top:2px}

/* ========================================
   操作ヒント（学習画面内）
   ======================================== */
.hint-bar{
  display:flex;justify-content:center;gap:18px;
  padding:6px 16px;opacity:.55;font-size:.75rem;color:var(--text);
}
.hint-bar span{display:flex;align-items:center;gap:4px}

/* ========================================
   カードエリア
   ======================================== */
.card-area{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:12px 16px 20px;gap:14px;
}

/* ナビ */
.nav-row{display:flex;gap:12px;align-items:center}
.nav-btn{
  width:44px;height:44px;border-radius:50%;
  border:2px solid var(--accent);background:var(--card-bg);
  color:var(--accent);font-size:1.2rem;cursor:pointer;
  transition:all .2s;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(var(--accent-rgb),.15);
}
.nav-btn:hover{background:var(--accent);color:#fff}

/* フリップカード */
.flip-container{
  width:min(88vw,400px);aspect-ratio:3/2;perspective:1200px;
  cursor:pointer;position:relative;
}
.flip-card{
  width:100%;height:100%;position:relative;
  transition:transform .6s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.flip-container.flipped .flip-card{transform:rotateY(180deg)}
.flip-front,.flip-back{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:24px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px 20px;gap:8px;
  background:var(--card-bg);
  box-shadow:0 8px 32px rgba(var(--accent-rgb),.12),0 2px 8px rgba(0,0,0,.06);
  border:2px solid var(--accent-light);
  overflow:hidden;
}
.flip-front::after{
  content:'';position:absolute;top:-30%;right:-30%;width:60%;height:60%;
  background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);
  pointer-events:none;
}
.flip-back{transform:rotateY(180deg);background:var(--surface)}
.card-num{
  position:absolute;top:12px;left:16px;
  font-size:.7rem;font-weight:700;color:var(--accent);opacity:.5;
}
.card-front-main{
  font-size:clamp(1.4rem,5vw,2rem);font-weight:900;color:var(--text);
  text-align:center;line-height:1.4;word-break:keep-all;
}
.card-front-sub{
  font-size:.85rem;color:var(--accent);opacity:.6;font-weight:400;
}
.card-back-word{
  font-size:clamp(1.2rem,4vw,1.6rem);font-weight:800;color:var(--accent);
  text-align:center;line-height:1.3;
}
.card-back-desc{
  font-size:clamp(.82rem,2.5vw,.95rem);color:var(--text);
  text-align:center;line-height:1.6;opacity:.8;
  max-height:40%;overflow-y:auto;
}
.tap-hint{
  position:absolute;bottom:10px;
  font-size:.65rem;opacity:.35;color:var(--text);
}

/* スワイプアニメーション */
.flip-container.swipe-left .flip-card{
  animation:swipeLeft .35s ease-out forwards;
}
.flip-container.swipe-right .flip-card{
  animation:swipeRight .35s ease-out forwards;
}
@keyframes swipeLeft{
  0%{transform:translateX(0) rotate(0);opacity:1}
  100%{transform:translateX(-120%) rotate(-8deg);opacity:0}
}
@keyframes swipeRight{
  0%{transform:translateX(0) rotate(0);opacity:1}
  100%{transform:translateX(120%) rotate(8deg);opacity:0}
}
.flip-container.enter-left .flip-card{
  animation:enterLeft .35s ease-out forwards;
}
.flip-container.enter-right .flip-card{
  animation:enterRight .35s ease-out forwards;
}
@keyframes enterLeft{
  0%{transform:translateX(120%) rotate(8deg);opacity:0}
  100%{transform:translateX(0) rotate(0);opacity:1}
}
@keyframes enterRight{
  0%{transform:translateX(-120%) rotate(-8deg);opacity:0}
  100%{transform:translateX(0) rotate(0);opacity:1}
}

/* ========================================
   応援モーダル
   ======================================== */
.cheer-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;opacity:0;pointer-events:none;transition:opacity .4s;
}
.cheer-overlay.show{opacity:1;pointer-events:auto}
.cheer-box{
  background:#fff;border-radius:28px;padding:36px 28px;
  text-align:center;max-width:340px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  transform:scale(.8);transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
.cheer-overlay.show .cheer-box{transform:scale(1)}
.cheer-emoji{font-size:3rem;margin-bottom:8px}
.cheer-msg{font-size:1rem;font-weight:700;line-height:1.7;color:#333;white-space:pre-line}
.cheer-close{
  margin-top:16px;padding:10px 32px;border-radius:20px;
  border:none;background:linear-gradient(135deg,#a78bfa,#60a5fa);
  color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;
  font-family:'Noto Sans JP',sans-serif;
}

/* ========================================
   フッター
   ======================================== */
footer{
  text-align:center;padding:14px;
  font-size:.7rem;opacity:.4;color:var(--text);
}
</style>
</head>
<body>

<!-- ==========================================
     ランディングページ
     ========================================== -->
<div class="landing" id="landing">
  <div class="brand">
    <div class="brand-logo">🏥</div>
    <h1>介護用語フラッシュカード</h1>
    <div class="brand-sub">Kaigo Vocabulary Flashcards</div>
  </div>

  <p class="landing-desc">
    介護福祉士の試験に出る用語を<br>
    母国語で楽しく覚えよう！
  </p>

  <div class="lang-section">
    <!-- 日本語ボタン -->
    <div class="lang-btn-ja" onclick="startApp('ja')">
      <div class="hinomaru"></div>
      <div class="ja-text">
        <span class="lang-main">日本語で学ぶ</span>
        <span class="lang-sub">単語 → ふりがな・意味</span>
      </div>
    </div>

    <!-- 3言語ボタン -->
    <div class="lang-grid">
      <div class="lang-btn id" onclick="startApp('id')">
        <span class="flag">ID</span>
        <span class="lang-name">Indonesia</span>
        <span class="lang-label">インドネシア語</span>
      </div>
      <div class="lang-btn vi" onclick="startApp('vi')">
        <span class="flag">VN</span>
        <span class="lang-name">Tiếng Việt</span>
        <span class="lang-label">ベトナム語</span>
      </div>
      <div class="lang-btn th" onclick="startApp('th')">
        <span class="flag">TH</span>
        <span class="lang-name">ภาษาไทย</span>
        <span class="lang-label">タイ語</span>
      </div>
    </div>
  </div>

  <!-- 操作説明 -->
  <div class="how-to" id="howTo">
    <p>
      <span class="icon">👆</span> タップでカードを裏返す<br>
      <span class="icon">👈👉</span> スワイプでカード切り替え
    </p>
  </div>

  <div class="credit">
    <div class="credit-org">一般社団法人 GIFT協会</div>
    <div class="credit-name">宗石 光英</div>
    <div class="credit-title">Created by Mitsuhide Muneishi</div>
  </div>
</div>

<!-- ==========================================
     学習画面
     ========================================== -->
<div id="app" style="display:none;flex-direction:column;min-height:100dvh">
  <header>
    <h2 id="headerTitle">📖 学習中</h2>
    <div class="header-btns">
      <button class="hbtn" onclick="shuffleCards()">🔀</button>
      <button class="hbtn" onclick="backToTop()">🏠</button>
    </div>
  </header>

  <div class="progress-area">
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-text" id="progressText"></div>
  </div>

  <!-- 操作ヒント（学習画面上部） -->
  <div class="hint-bar" id="hintBar">
    <span>👆 タップ＝裏返す</span>
    <span>👈👉 スワイプ＝次/前</span>
  </div>

  <div class="card-area">
    <div class="flip-container" id="flipContainer" onclick="flipCard()">
      <div class="flip-card" id="flipCard">
        <div class="flip-front" id="cardFront">
          <span class="card-num" id="cardNum"></span>
          <div class="card-front-main" id="frontMain"></div>
          <div class="card-front-sub" id="frontSub"></div>
          <span class="tap-hint" id="tapHintFront"></span>
        </div>
        <div class="flip-back" id="cardBack">
          <span class="card-num" id="cardNumBack"></span>
          <div class="card-back-word" id="backWord"></div>
          <div class="card-back-desc" id="backDesc"></div>
          <span class="tap-hint" id="tapHintBack"></span>
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" onclick="prevCard()">◀</button>
      <button class="nav-btn" onclick="nextCard()">▶</button>
    </div>
  </div>
  <footer>© 一般社団法人 GIFT協会</footer>
</div>

<!-- 応援モーダル -->
<div class="cheer-overlay" id="cheerOverlay">
  <div class="cheer-box">
    <div class="cheer-emoji" id="cheerEmoji"></div>
    <div class="cheer-msg" id="cheerMsg"></div>
    <button class="cheer-close" onclick="closeCheer()">OK!</button>
  </div>
</div>

<script>
/* ========================================
   データ＆状態
   ======================================== */
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRkTS_qE9X6cIZrofQmV9bDSfQVBAp0IoGbQ6e0esP6UQp_L97pRv4D1LRuv_h-4AGohXtrHALsWtSv/pub?output=csv';
let allData=[],currentLang='',idx=0,viewedCount=0,lastCheerAt=0;

/* 言語メタ情報 */
const LANG_META={
  ja:{
    header:'📖 日本語で学習中',
    tapFront:'タップで意味を見る',
    tapBack:'タップで表に戻す',
    hintTap:'👆 タップ＝裏返す',
    hintSwipe:'👈👉 スワイプ＝次/前'
  },
  id:{
    header:'📖 Belajar Bahasa Indonesia',
    tapFront:'Ketuk untuk lihat arti',
    tapBack:'Ketuk untuk kembali',
    hintTap:'👆 Ketuk = balik kartu',
    hintSwipe:'👈👉 Geser = kartu berikutnya'
  },
  vi:{
    header:'📖 Học Tiếng Việt',
    tapFront:'Chạm để xem nghĩa',
    tapBack:'Chạm để quay lại',
    hintTap:'👆 Chạm = lật thẻ',
    hintSwipe:'👈👉 Vuốt = thẻ tiếp theo'
  },
  th:{
    header:'📖 เรียนภาษาไทย',

/* ========================================
   アプリ起動
   ======================================== */
function startApp(lang){
  currentLang=lang;
  document.getElementById('landing').style.display='none';
  const app=document.getElementById('app');
  app.style.display='flex';
  document.body.className='lang-'+lang;

  const meta=LANG_META[lang];
  document.getElementById('headerTitle').textContent=meta.header;

  /* 学習画面内のヒントバーを言語対応 */
  document.getElementById('hintBar').innerHTML=
    '<span>'+meta.hintTap+'</span><span>'+meta.hintSwipe+'</span>';

  loadData();
}

function backToTop(){
  document.getElementById('app').style.display='none';
  document.getElementById('landing').style.display='flex';
  document.body.className='';
  viewedCount=0;lastCheerAt=0;idx=0;
  /* ランディングページの操作説明をリセット */
  document.getElementById('howTo').querySelector('p').innerHTML=HOW_TO_TEXT.ja;
}

/* ========================================
   データ読み込み
   ======================================== */
function loadData(){
  Papa.parse(CSV_URL,{
    download:true,header:false,skipEmptyLines:true,
    complete:function(results){
      const rows=results.data.slice(1);
      allData=rows.filter(r=>r[0]&&r[1]).map(r=>({
        no:r[0],word:r[1],
        idWord:r[2]||'',viWord:r[3]||'',thWord:r[4]||'',
        meaning:r[5]||'',
        idDesc:r[6]||'',viDesc:r[7]||'',thDesc:r[8]||''
      }));
      idx=0;viewedCount=0;lastCheerAt=0;
      showCard();
    }
  });
}

/* ========================================
   カード表示
   ======================================== */
function showCard(){
  if(!allData.length)return;
  const d=allData[idx];
  const total=allData.length;
  const pct=Math.round(((idx+1)/total)*100);

  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressPct').textContent=pct+'%';
  document.getElementById('progressText').textContent=(idx+1)+' / '+total;

  const meta=LANG_META[currentLang];
  document.getElementById('tapHintFront').textContent=meta.tapFront;
  document.getElementById('tapHintBack').textContent=meta.tapBack;

  /* 表のふりがなと漢字を分離 */
  let mainText='',subText='';
  const w=d.word;
  const m=w.match(/^(.+?)（(.+?)）$/);
  if(m){mainText=m[1];subText=m[2];}
  else{mainText=w;subText='';}

  if(currentLang==='ja'){
    /* 日本語モード：表＝漢字、裏＝ふりがな＋意味 */
    document.getElementById('frontMain').textContent=mainText;
    document.getElementById('frontSub').textContent='';
    document.getElementById('cardNum').textContent='No.'+d.no;
    document.getElementById('cardNumBack').textContent='No.'+d.no;
    document.getElementById('backWord').textContent=subText||mainText;
    document.getElementById('backDesc').textContent=d.meaning;
  }else{
    /* 外国語モード：表＝日本語（漢字＋ふりがな）、裏＝外国語 */
    document.getElementById('frontMain').textContent=mainText;
    document.getElementById('frontSub').textContent=subText;
    document.getElementById('cardNum').textContent='No.'+d.no;
    document.getElementById('cardNumBack').textContent='No.'+d.no;

    let bWord='',bDesc='';
    if(currentLang==='id'){bWord=d.idWord;bDesc=d.idDesc;}
    else if(currentLang==='vi'){bWord=d.viWord;bDesc=d.viDesc;}
    else if(currentLang==='th'){bWord=d.thWord;bDesc=d.thDesc;}

    document.getElementById('backWord').textContent=bWord;
    document.getElementById('backDesc').textContent=bDesc;
  }

  /* カードを表に戻す */
  document.getElementById('flipContainer').classList.remove('flipped');
}

/* ========================================
   カード操作
   ======================================== */
function flipCard(){
  document.getElementById('flipContainer').classList.toggle('flipped');
}

function nextCard(){
  if(!allData.length)return;
  const container=document.getElementById('flipContainer');
  container.classList.add('swipe-left');
  setTimeout(()=>{
    container.classList.remove('swipe-left','flipped');
    idx=(idx+1)%allData.length;
    viewedCount++;
    showCard();
    checkCheer();
    container.classList.add('enter-left');
    setTimeout(()=>container.classList.remove('enter-left'),350);
  },300);
}

function prevCard(){
  if(!allData.length)return;
  const container=document.getElementById('flipContainer');
  container.classList.add('swipe-right');
  setTimeout(()=>{
    container.classList.remove('swipe-right','flipped');
    idx=(idx-1+allData.length)%allData.length;
    showCard();
    container.classList.add('enter-right');
    setTimeout(()=>container.classList.remove('enter-right'),350);
  },300);
}

function shuffleCards(){
  for(let i=allData.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [allData[i],allData[j]]=[allData[j],allData[i]];
  }
  idx=0;viewedCount=0;lastCheerAt=0;showCard();
}

/* ========================================
   スワイプ操作
   ======================================== */
(function(){
  let startX=0,startY=0,isDragging=false;
  const threshold=50;

  document.addEventListener('touchstart',function(e){
    const t=e.touches[0];
    startX=t.clientX;startY=t.clientY;isDragging=true;
  },{passive:true});

  document.addEventListener('touchend',function(e){
    if(!isDragging)return;
    isDragging=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-startX;
    const dy=t.clientY-startY;
    if(Math.abs(dx)>threshold && Math.abs(dx)>Math.abs(dy)*1.2){
      if(dx<0)nextCard();
      else prevCard();
    }
  },{passive:true});
})();

/* キーボード操作 */
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight')nextCard();
  else if(e.key==='ArrowLeft')prevCard();
  else if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard();}
});

/* ========================================
   応援チェック
   ======================================== */
function checkCheer(){
  for(const c of CHEERS){
    if(viewedCount>=c.at && lastCheerAt<c.at){
      lastCheerAt=c.at;
      showCheer(c.emoji,c.msg);
      return;
    }
  }
}

function showCheer(emoji,msg){
  document.getElementById('cheerEmoji').textContent=emoji;
  document.getElementById('cheerMsg').textContent=msg;
  document.getElementById('cheerOverlay').classList.add('show');
  if(typeof confetti==='function'){
    confetti({particleCount:120,spread:80,origin:{y:.6},colors:['#a78bfa','#60a5fa','#34d399','#fbbf24','#f472b6']});
  }
}

function closeCheer(){
  document.getElementById('cheerOverlay').classList.remove('show');
}
