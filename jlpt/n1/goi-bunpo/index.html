<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語彙・文法｜JLPT N1｜学びアプリ｜一般社団法人GIFT協会</title>
  <meta name="description" content="JLPT N1の語彙・文法を練習しよう。漢字の読み・文脈規定・言い換え類義語・用法・文法。">
  <link rel="icon" href="../../../gift-icon.png">
  <link rel="apple-touch-icon" href="../../../gift-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script>
    (function(){
      const theme    = localStorage.getItem('gift_theme')    || 'dark';
      const fontsize = localStorage.getItem('gift_fontsize') || 'normal';
      const ruby     = localStorage.getItem('gift_ruby')     || 'on';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-fontsize', fontsize);
      document.documentElement.setAttribute('data-ruby', ruby);
    })();
  </script>

  <style>
    :root { --font-scale: 1; }
    html[data-fontsize="normal"] { --font-scale: 1; }
    html[data-fontsize="large"]  { --font-scale: 1.125; }
    html[data-fontsize="xlarge"] { --font-scale: 1.25; }

    html[data-theme="dark"] {
      --bg-start:#0e0d1a; --bg-mid:#1a1830; --bg-end:#0e0d1a;
      --border:rgba(255,255,255,0.10);
      --text-primary:#f0ece0; --text-secondary:rgba(240,236,224,0.65); --text-muted:rgba(240,236,224,0.40);
      --accent:#c9973a; --accent-glow:rgba(201,151,58,0.25);
      --panel-bg:rgba(20,18,35,0.85); --panel-border:rgba(201,151,58,0.30);
      --btn-inactive:rgba(255,255,255,0.07); --btn-inactive-text:rgba(240,236,224,0.55);
      --btn-active-bg:linear-gradient(135deg,#b8863a,#c9973a); --btn-active-text:#fff;
      --divider-color:rgba(201,151,58,0.50);
      --tag-bg:rgba(255,255,255,0.10); --tag-text:rgba(240,236,224,0.75);
      --card-active:linear-gradient(135deg,rgba(130,90,20,0.60),rgba(100,65,10,0.45));
      --card-active-border:rgba(200,155,50,0.40);
      --card-disabled:linear-gradient(135deg,rgba(50,50,70,0.50),rgba(35,35,55,0.35));
      --card-disabled-border:rgba(120,120,150,0.20);
      --back-btn-bg:rgba(255,255,255,0.07); --back-btn-border:rgba(255,255,255,0.15);
    }

    html[data-theme="light"] {
      --bg-start:#f2ede4; --bg-mid:#ede6d8; --bg-end:#e8dfd0;
      --border:rgba(150,120,70,0.18);
      --text-primary:#3a2e1e; --text-secondary:rgba(58,46,30,0.72); --text-muted:rgba(58,46,30,0.45);
      --accent:#9a6c1e; --accent-glow:rgba(154,108,30,0.20);
      --panel-bg:rgba(245,240,230,0.92); --panel-border:rgba(154,108,30,0.30);
      --btn-inactive:rgba(180,150,100,0.15); --btn-inactive-text:rgba(58,46,30,0.55);
      --btn-active-bg:linear-gradient(135deg,#9a6c1e,#b8863a); --btn-active-text:#fff;
      --divider-color:rgba(154,108,30,0.45);
      --tag-bg:rgba(154,108,30,0.12); --tag-text:rgba(58,46,30,0.80);
      --card-active:linear-gradient(135deg,rgba(240,220,170,0.75),rgba(230,205,145,0.60));
      --card-active-border:rgba(180,140,40,0.35);
      --card-disabled:linear-gradient(135deg,rgba(210,210,220,0.60),rgba(195,195,210,0.45));
      --card-disabled-border:rgba(140,140,160,0.25);
      --back-btn-bg:rgba(150,120,70,0.12); --back-btn-border:rgba(150,120,70,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: calc(16px * var(--font-scale));
      background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
      min-height: 100vh; color: var(--text-primary);
      transition: background 0.4s, color 0.4s;
      padding-bottom: 60px;
    }
    html[data-ruby="off"] ruby rt { display: none; }

    .site-header {
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 20px 16px; gap: 4px;
    }
    .header-logo-row { display: flex; align-items: center; gap: 10px; }
    .header-logo-row img.logo { width: 36px; height: 36px; object-fit: contain; }
    .header-title {
      font-family: 'Poppins','Noto Sans JP',sans-serif;
      font-size: calc(1.1rem * var(--font-scale)); font-weight: 800;
      background: linear-gradient(90deg, var(--accent), #f0d080, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-sub { font-size: calc(0.65rem * var(--font-scale)); color: var(--text-muted); letter-spacing: .08em; }

    .settings-panel {
      width: calc(100% - 32px); max-width: 560px; margin: 0 auto 20px;
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 18px; padding: 10px 16px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: flex; flex-wrap: nowrap; align-items: center; gap: 10px;
      overflow-x: auto; scrollbar-width: none;
    }
    .settings-panel::-webkit-scrollbar { display: none; }
    .sp-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .sp-label { font-size: calc(0.65rem * var(--font-scale)); color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .sp-divider { width: 1px; height: 26px; background: var(--border); flex-shrink: 0; }
    .ruby-switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; flex-shrink: 0; }
    .ruby-switch input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .ruby-track {
      width: 44px; height: 24px; background: var(--btn-inactive);
      border: 1.5px solid var(--border); border-radius: 12px; position: relative;
      transition: background 0.3s, border-color 0.3s;
    }
    .ruby-thumb {
      position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
      background: var(--btn-inactive-text); border-radius: 50%;
      transition: transform 0.3s, background 0.3s;
    }
    .ruby-switch input:checked ~ .ruby-track { background: linear-gradient(135deg,#b8863a,#c9973a); border-color: var(--accent); }
    .ruby-switch input:checked ~ .ruby-track .ruby-thumb { transform: translateX(20px); background: #fff; }
    .sp-btn-group { display: flex; gap: 4px; flex-shrink: 0; }
    .sp-btn {
      padding: 4px 9px; border-radius: 9px; border: 1.5px solid transparent;
      background: var(--btn-inactive); color: var(--btn-inactive-text);
      font-family: 'Poppins','Noto Sans JP',sans-serif;
      font-size: calc(0.68rem * var(--font-scale)); font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0;
    }
    .sp-btn.active { background: var(--btn-active-bg); color: var(--btn-active-text); border-color: var(--accent); box-shadow: 0 2px 8px var(--accent-glow); }

    .main-section { width: calc(100% - 32px); max-width: 560px; margin: 0 auto; }

    .page-title-block { text-align: center; margin-bottom: 28px; padding-top: 8px; }
    .page-title-en {
      font-family: 'Poppins', sans-serif;
      font-size: calc(0.68rem * var(--font-scale));
      font-weight: 700; letter-spacing: .25em; color: var(--accent); opacity: .7; margin-bottom: 6px;
    }
    .page-title-emoji { font-size: 2.2rem; line-height: 1; margin-bottom: 6px; }
    .page-title-ruby {
      font-size: calc(0.60rem * var(--font-scale));
      color: var(--accent); opacity: .65; letter-spacing: .12em; margin-bottom: 2px; line-height: 1;
    }
    .page-title-ja {
      font-size: calc(0.95rem * var(--font-scale));
      font-weight: 700; color: var(--text-secondary); margin-bottom: 10px;
    }

    .section-divider { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; }
    .divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--divider-color), transparent); }
    .divider-ornament { display: flex; flex-direction: column; align-items: center; gap: 3px; flex-shrink: 0; }
    .divider-stars { color: var(--accent); font-size: .60rem; letter-spacing: .18em; opacity: .7; }
    .divider-text {
      font-family: 'Poppins', sans-serif;
      font-size: calc(0.60rem * var(--font-scale));
      font-style: italic; font-weight: 700; color: var(--accent); letter-spacing: .18em; white-space: nowrap;
    }
    .divider-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); opacity: .6; }

    .subject-list { list-style: none; display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }
    .subject-card {
      display: flex; align-items: center; gap: 16px;
      border-radius: 22px; padding: 20px;
      text-decoration: none; color: var(--text-primary);
      border: 1px solid transparent; position: relative; overflow: hidden;
      transition: transform .25s, box-shadow .25s;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .subject-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.25); }
    .subject-card-active  { background: var(--card-active);   border-color: var(--card-active-border); }
    .subject-card-soon    { background: var(--card-disabled); border-color: var(--card-disabled-border); opacity: 0.50; cursor: not-allowed; pointer-events: none; }

    .card-badge {
      position: absolute; top: 12px; right: 12px;
      font-size: .55rem; font-weight: 800; letter-spacing: .10em;
      padding: 3px 9px; border-radius: 20px;
    }
    .badge-new  { background: linear-gradient(135deg,#c9973a,#f0d080); color: #3a2e1e; }
    .badge-soon { background: rgba(120,120,150,0.35); color: rgba(240,236,224,0.55); }

    .card-icon { font-size: 2.0rem; flex-shrink: 0; }
    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-size: calc(1.0rem * var(--font-scale)); font-weight: 800;
      margin-bottom: 4px;
    }
    .card-desc {
      font-size: calc(0.72rem * var(--font-scale));
      color: var(--text-muted); line-height: 1.5;
    }

    /* ─── 進捗バー ─── */
    .card-progress { margin-top: 10px; }
    .progress-bar-wrap { height: 4px; background: rgba(255,255,255,0.10); border-radius: 2px; }
    .progress-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg,#b8863a,#c9973a); transition: width 0.5s; }
    .progress-label { font-size: calc(0.58rem * var(--font-scale)); color: var(--text-muted); margin-top: 4px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--back-btn-bg); border: 1px solid var(--back-btn-border);
      border-radius: 12px; padding: 8px 16px; margin-bottom: 20px;
      font-size: calc(0.78rem * var(--font-scale)); color: var(--text-secondary);
      text-decoration: none; transition: all 0.2s;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-logo-row">
    <img src="../../../gift-logo.png" alt="GIFTロゴ" class="logo">
    <span class="header-title">Manabi App</span>
  </div>
  <span class="header-sub">一般社団法人 GIFT 協会</span>
</header>

<div class="settings-panel">
  <div class="sp-group">
    <span class="sp-label">ふりがな</span>
    <label class="ruby-switch">
      <input type="checkbox" id="ruby-toggle" onchange="setRuby(this.checked)">
      <span class="ruby-track"><span class="ruby-thumb"></span></span>
    </label>
  </div>
  <div class="sp-divider"></div>
  <div class="sp-group">
    <span class="sp-label">文字</span>
    <div class="sp-btn-group">
      <button class="sp-btn" id="fs-s" onclick="setFontSize('normal')">S</button>
      <button class="sp-btn" id="fs-m" onclick="setFontSize('large')">M</button>
      <button class="sp-btn" id="fs-l" onclick="setFontSize('xlarge')">L</button>
    </div>
  </div>
  <div class="sp-divider"></div>
  <div class="sp-group">
    <button class="sp-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
</div>

<main class="main-section">
  <a class="back-btn" href="../index.html">← N1 科目選択にもどる</a>

  <div class="page-title-block">
    <div class="page-title-en">VOCABULARY &amp; GRAMMAR</div>
    <div class="page-title-emoji">📝</div>
    <div class="page-title-ruby">ごい・ぶんぽう</div>
    <div class="page-title-ja">語彙・文法</div>
  </div>

  <!-- 語彙セクション -->
  <div class="section-divider">
    <div class="divider-line"></div>
    <div class="divider-ornament">
      <div class="divider-stars">✦ ✦ ✦</div>
      <div class="divider-text">VOCABULARY</div>
      <div class="divider-dot"></div>
    </div>
    <div class="divider-line"></div>
  </div>

  <ul class="subject-list">
    <!-- 語彙カード → 語彙カテゴリ選択ページへ -->
    <li>
      <a href="./goi/index.html" class="subject-card subject-card-active">
        <span class="card-badge badge-new">NEW</span>
        <span class="card-icon">📖</span>
        <div class="card-body">
          <div class="card-title"><ruby>語彙<rt>ごい</rt></ruby></div>
          <div class="card-desc">漢字の読み・文脈規定・類義語・用法の4カテゴリで語彙力を鍛えよう</div>
          <div class="card-progress">
            <div class="progress-bar-wrap">
              <div class="progress-bar-fill" id="goi-bar" style="width:0%"></div>
            </div>
            <div class="progress-label" id="goi-label">読み込み中...</div>
          </div>
        </div>
      </a>
    </li>
  </ul>

  <!-- 文法セクション -->
  <div class="section-divider">
    <div class="divider-line"></div>
    <div class="divider-ornament">
      <div class="divider-stars">✦ ✦ ✦</div>
      <div class="divider-text">GRAMMAR</div>
      <div class="divider-dot"></div>
    </div>
    <div class="divider-line"></div>
  </div>

  <ul class="subject-list">
    <li>
      <div class="subject-card subject-card-soon">
        <span class="card-badge badge-soon">準備中</span>
        <span class="card-icon">✍️</span>
        <div class="card-body">
          <div class="card-title"><ruby>文法<rt>ぶんぽう</rt></ruby></div>
          <div class="card-desc">文の組み立て・接続・文法形式の問題（Coming Soon）</div>
        </div>
      </div>
    </li>
  </ul>

</main>

<script>
function applySettings() {
  const theme    = localStorage.getItem('gift_theme')    || 'dark';
  const fontsize = localStorage.getItem('gift_fontsize') || 'normal';
  const ruby     = localStorage.getItem('gift_ruby')     || 'on';
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-fontsize', fontsize);
  document.documentElement.setAttribute('data-ruby', ruby);
  const tb = document.getElementById('theme-btn');
  if (tb) tb.textContent = (theme === 'dark') ? '🌙' : '☀️';
  const map = { normal:'fs-s', large:'fs-m', xlarge:'fs-l' };
  ['fs-s','fs-m','fs-l'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
  });
  const activeEl = document.getElementById(map[fontsize] || 'fs-s');
  if (activeEl) activeEl.classList.add('active');
  const rt = document.getElementById('ruby-toggle');
  if (rt) rt.checked = (ruby === 'on');
}
function setFontSize(size) { localStorage.setItem('gift_fontsize', size); applySettings(); }
function toggleTheme() {
  const next = (localStorage.getItem('gift_theme') || 'dark') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('gift_theme', next); applySettings();
}
function setRuby(checked) { localStorage.setItem('gift_ruby', checked ? 'on' : 'off'); applySettings(); }

/* 語彙の進捗バーを更新 */
function loadGoiProgress() {
  const results = JSON.parse(localStorage.getItem('jlpt_n1_yomi_results') || '{}');
  const total   = 100; /* 現在の問題数（増えたら自動で割合が変わる） */
  const done    = Object.keys(results).length;
  const pct     = Math.min(Math.round(done / total * 100), 100);
  const bar     = document.getElementById('goi-bar');
  const lbl     = document.getElementById('goi-label');
  if (bar) bar.style.width = pct + '%';
  if (lbl) lbl.textContent = `${done}問 挑戦済み`;
}

document.addEventListener('DOMContentLoaded', () => {
  applySettings();
  loadGoiProgress();
});
</script>
</body>
</html>
