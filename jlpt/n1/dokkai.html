<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N1 読解練習｜学びアプリ｜一般社団法人GIFT協会</title>
  <meta name="description" content="JLPT N1読解練習。6カテゴリ147問。">
  <link rel="icon" href="../../gift-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script>
    /* ─── 設定の即時適用（フラッシュ防止） ─── */
    (function(){
      const theme    = localStorage.getItem('gift_theme')    || 'dark';
      const fontsize = localStorage.getItem('gift_fontsize') || 'normal';
      const ruby     = localStorage.getItem('gift_ruby')     || 'on';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-fontsize', fontsize);
      document.documentElement.setAttribute('data-ruby', ruby);
    })();
  </script>

  <style>
    :root { --font-scale: 1; }
    html[data-fontsize="normal"] { --font-scale: 1; }
    html[data-fontsize="large"]  { --font-scale: 1.125; }
    html[data-fontsize="xlarge"] { --font-scale: 1.25; }

    html[data-theme="dark"] {
      --bg-start:#0e0d1a; --bg-mid:#1a1830; --bg-end:#0e0d1a;
      --surface:rgba(255,255,255,0.05); --surface-2:rgba(255,255,255,0.08);
      --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.20);
      --text-primary:#f0ece0; --text-secondary:rgba(240,236,224,0.65); --text-muted:rgba(240,236,224,0.40);
      --accent:#c9973a; --accent-glow:rgba(201,151,58,0.25);
      --panel-bg:rgba(20,18,35,0.90); --panel-border:rgba(201,151,58,0.30);
      --btn-inactive:rgba(255,255,255,0.07); --btn-inactive-text:rgba(240,236,224,0.55);
      --btn-active-bg:linear-gradient(135deg,#b8863a,#c9973a); --btn-active-text:#fff;
      --tab-active-bg:linear-gradient(135deg,#b8863a,#c9973a);
      --choice-bg:rgba(255,255,255,0.06); --choice-hover:rgba(255,255,255,0.11);
      --choice-correct:rgba(74,222,128,0.20); --choice-correct-border:rgba(74,222,128,0.60);
      --choice-wrong:rgba(248,113,113,0.20); --choice-wrong-border:rgba(248,113,113,0.60);
      --explain-bg:rgba(201,151,58,0.10); --explain-border:rgba(201,151,58,0.30);
      --progress-bg:rgba(255,255,255,0.08); --progress-fill:linear-gradient(90deg,#b8863a,#c9973a);
      --streak-bg:rgba(201,151,58,0.15); --streak-border:rgba(201,151,58,0.35);
      --back-btn-bg:rgba(255,255,255,0.07); --back-btn-border:rgba(255,255,255,0.15);
      --result-bg:rgba(255,255,255,0.04);
    }
    html[data-theme="light"] {
      --bg-start:#f2ede4; --bg-mid:#ede6d8; --bg-end:#e8dfd0;
      --surface:rgba(255,255,255,0.65); --surface-2:rgba(255,255,255,0.85);
      --border:rgba(150,120,70,0.18); --border-strong:rgba(150,120,70,0.35);
      --text-primary:#3a2e1e; --text-secondary:rgba(58,46,30,0.72); --text-muted:rgba(58,46,30,0.45);
      --accent:#9a6c1e; --accent-glow:rgba(154,108,30,0.20);
      --panel-bg:rgba(245,240,230,0.95); --panel-border:rgba(154,108,30,0.30);
      --btn-inactive:rgba(180,150,100,0.15); --btn-inactive-text:rgba(58,46,30,0.55);
      --btn-active-bg:linear-gradient(135deg,#9a6c1e,#b8863a); --btn-active-text:#fff;
      --tab-active-bg:linear-gradient(135deg,#9a6c1e,#b8863a);
      --choice-bg:rgba(255,255,255,0.70); --choice-hover:rgba(255,255,255,0.90);
      --choice-correct:rgba(74,222,128,0.18); --choice-correct-border:rgba(34,197,94,0.55);
      --choice-wrong:rgba(248,113,113,0.18); --choice-wrong-border:rgba(239,68,68,0.55);
      --explain-bg:rgba(154,108,30,0.08); --explain-border:rgba(154,108,30,0.30);
      --progress-bg:rgba(150,120,70,0.12); --progress-fill:linear-gradient(90deg,#9a6c1e,#b8863a);
      --streak-bg:rgba(154,108,30,0.10); --streak-border:rgba(154,108,30,0.30);
      --back-btn-bg:rgba(150,120,70,0.12); --back-btn-border:rgba(150,120,70,0.25);
      --result-bg:rgba(0,0,0,0.03);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: calc(16px * var(--font-scale));
      background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
      min-height: 100vh;
      color: var(--text-primary);
      transition: background 0.4s, color 0.4s;
      padding-bottom: 80px;
    }
    html[data-ruby="off"] ruby rt { display: none; }

    /* ── ヘッダー ── */
    .site-header {
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 20px 12px; gap: 3px;
    }
    .header-logo-row { display: flex; align-items: center; gap: 10px; }
    .header-logo-row img.logo { width: 30px; height: 30px; object-fit: contain; }
    .header-title {
      font-family: 'Poppins','Noto Sans JP',sans-serif;
      font-size: calc(1.0rem * var(--font-scale)); font-weight: 800;
      background: linear-gradient(90deg, var(--accent), #f0d080, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-sub { font-size: calc(0.60rem * var(--font-scale)); color: var(--text-muted); }

    /* ── 設定パネル ── */
    .settings-panel {
      width: calc(100% - 32px); max-width: 640px; margin: 0 auto 16px;
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 16px; padding: 8px 14px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: flex; flex-wrap: nowrap; align-items: center; gap: 10px;
      overflow-x: auto; scrollbar-width: none;
    }
    .settings-panel::-webkit-scrollbar { display: none; }
    .sp-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .sp-label { font-size: calc(0.62rem * var(--font-scale)); color: var(--text-muted); white-space: nowrap; }
    .sp-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }

    /* ふりがなスイッチ */
    .ruby-switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; flex-shrink: 0; }
    .ruby-switch input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .ruby-track {
      width: 42px; height: 22px; background: var(--btn-inactive);
      border: 1.5px solid var(--border); border-radius: 11px; position: relative;
      transition: background 0.3s, border-color 0.3s;
    }
    .ruby-thumb {
      position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
      background: var(--btn-inactive-text); border-radius: 50%;
      transition: transform 0.3s, background 0.3s;
    }
    .ruby-switch input:checked ~ .ruby-track { background: linear-gradient(135deg,#b8863a,#c9973a); border-color: var(--accent); }
    .ruby-switch input:checked ~ .ruby-track .ruby-thumb { transform: translateX(20px); background: #fff; }

    .sp-btn-group { display: flex; gap: 4px; flex-shrink: 0; }
    .sp-btn {
      padding: 3px 8px; border-radius: 8px; border: 1.5px solid transparent;
      background: var(--btn-inactive); color: var(--btn-inactive-text);
      font-family: 'Poppins','Noto Sans JP',sans-serif;
      font-size: calc(0.65rem * var(--font-scale)); font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: all 0.2s;
    }
    .sp-btn.active { background: var(--btn-active-bg); color: var(--btn-active-text); border-color: var(--accent); box-shadow: 0 2px 8px var(--accent-glow); }

    /* ── メインラッパー ── */
    .main-wrap { width: calc(100% - 32px); max-width: 640px; margin: 0 auto; }

    /* ── カテゴリ選択画面 ── */
    #screen-category { display: block; }
    #screen-quiz     { display: none; }
    #screen-result   { display: none; }

    /* タイトル：ふりがな見切れ対策で3段分離 */
    .screen-title { text-align: center; margin-bottom: 24px; padding-top: 8px; }
    .screen-title-en {
      font-family: 'Poppins', sans-serif;
      font-size: calc(0.65rem * var(--font-scale));
      font-weight: 700; letter-spacing: .22em;
      color: var(--accent); opacity: .7; margin-bottom: 6px;
    }
    .screen-title-ruby {
      font-size: calc(0.72rem * var(--font-scale));
      color: var(--text-muted); letter-spacing: .08em;
      margin-bottom: 2px; line-height: 1.4;
    }
    html[data-ruby="off"] .screen-title-ruby { display: none; }
    .screen-title-ja {
      font-family: 'Poppins','Noto Sans JP',sans-serif;
      font-size: clamp(1.3rem, 5vw, calc(1.6rem * var(--font-scale)));
      font-weight: 800; line-height: 1.3;
      background: linear-gradient(90deg, var(--accent), #f0d080, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* ── プロフィールボックス ── */
    .profile-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 20px 18px; margin-bottom: 20px;
    }
    .profile-box-title {
      font-size: calc(0.80rem * var(--font-scale)); font-weight: 700;
      color: var(--accent); text-align: center; margin-bottom: 14px;
    }
    .profile-empty {
      text-align: center; color: var(--text-muted);
      font-size: calc(0.78rem * var(--font-scale)); padding: 8px 0;
    }
    .radar-wrap { position: relative; width: 100%; max-width: 280px; margin: 0 auto 12px; }

    /* ── カテゴリカード ── */
    .cat-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .cat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px 18px;
      display: flex; align-items: center; gap: 14px;
      cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.15s;
      text-decoration: none; color: inherit;
    }
    .cat-card:hover { background: var(--surface-2); border-color: var(--border-strong); transform: translateY(-2px); }
    .cat-card-icon { font-size: 1.6rem; flex-shrink: 0; }
    .cat-card-body { flex: 1; min-width: 0; }
    .cat-card-name {
      font-size: calc(0.92rem * var(--font-scale)); font-weight: 700;
      color: var(--text-primary); margin-bottom: 4px;
    }
    .cat-card-meta {
      font-size: calc(0.72rem * var(--font-scale)); color: var(--text-secondary);
    }
    .cat-card-badge {
      flex-shrink: 0; font-size: calc(0.72rem * var(--font-scale));
      font-weight: 700; padding: 3px 10px; border-radius: 20px;
      background: var(--surface-2); color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .cat-card-badge.good  { background: rgba(74,222,128,0.15); color:#4ade80; border-color:rgba(74,222,128,0.40); }
    .cat-card-badge.weak  { background: rgba(248,113,113,0.15); color:#f87171; border-color:rgba(248,113,113,0.40); }
    .cat-card-badge.new   { background: rgba(201,151,58,0.15);  color:var(--accent); border-color:rgba(201,151,58,0.35); }

    /* ── ローディング ── */
    #loading-msg {
      text-align: center; padding: 32px 0;
      font-size: calc(0.88rem * var(--font-scale)); color: var(--text-muted);
    }

    /* ── クイズ画面 ── */
    .quiz-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }
    .quiz-cat-label {
      font-size: calc(0.72rem * var(--font-scale)); font-weight: 700;
      color: var(--accent); letter-spacing: .08em;
    }
    .quiz-counter {
      font-family: 'Poppins',sans-serif;
      font-size: calc(0.78rem * var(--font-scale)); color: var(--text-muted);
    }
    .progress-bar-wrap {
      width: 100%; height: 5px; background: var(--progress-bg);
      border-radius: 3px; margin-bottom: 16px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--progress-fill);
      border-radius: 3px; transition: width 0.4s ease; width: 0%;
    }
    .timer-streak-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .timer-box {
      font-family: 'Poppins',sans-serif;
      font-size: calc(0.82rem * var(--font-scale)); color: var(--text-secondary);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 4px 12px;
    }
    .timer-label { font-size: calc(0.85rem * var(--font-scale)); }
    .speed-badge {
      font-size: calc(0.72rem * var(--font-scale)); font-weight: 700;
      padding: 3px 10px; border-radius: 20px; border: 1px solid; display: none;
    }
    .speed-badge.fast   { background:rgba(74,222,128,0.15); color:#4ade80; border-color:rgba(74,222,128,0.40); }
    .speed-badge.normal { background:rgba(201,151,58,0.15); color:var(--accent); border-color:rgba(201,151,58,0.35); }
    .speed-badge.slow   { background:rgba(248,113,113,0.15); color:#f87171; border-color:rgba(248,113,113,0.40); }
    .streak-box {
      margin-left: auto;
      font-size: calc(0.82rem * var(--font-scale)); font-weight: 700;
      background: var(--streak-bg); border: 1px solid var(--streak-border);
      border-radius: 10px; padding: 4px 12px; color: var(--accent);
    }

    /* 問題カード */
    .question-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 22px 18px; margin-bottom: 16px;
    }
    .question-passage {
      font-size: calc(0.88rem * var(--font-scale)); line-height: 1.85;
      color: var(--text-primary); margin-bottom: 16px;
      white-space: pre-wrap; border-bottom: 1px solid var(--border); padding-bottom: 14px;
    }
    .question-stem {
      font-size: calc(0.90rem * var(--font-scale)); font-weight: 700;
      color: var(--text-primary); line-height: 1.6;
    }

    /* 選択肢 */
    .choices-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .choice-btn {
      width: 100%; text-align: left; padding: 13px 16px;
      background: var(--choice-bg); border: 1.5px solid var(--border);
      border-radius: 14px; cursor: pointer;
      font-family: 'Noto Sans JP',sans-serif;
      font-size: calc(0.88rem * var(--font-scale)); color: var(--text-primary);
      line-height: 1.6; transition: background 0.2s, border-color 0.2s;
    }
    .choice-btn:hover:not(:disabled) { background: var(--choice-hover); }
    .choice-btn:disabled { cursor: default; }
    .choice-btn.correct { background: var(--choice-correct); border-color: var(--choice-correct-border); }
    .choice-btn.wrong   { background: var(--choice-wrong);   border-color: var(--choice-wrong-border); }

    /* 解説 */
    .explain-box {
      background: var(--explain-bg); border: 1px solid var(--explain-border);
      border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; display: none;
    }
    .explain-label {
      font-size: calc(0.72rem * var(--font-scale)); font-weight: 700;
      color: var(--accent); margin-bottom: 8px;
    }
    .explain-text {
      font-size: calc(0.85rem * var(--font-scale)); line-height: 1.75;
      color: var(--text-secondary); white-space: pre-wrap;
    }

    /* 次へボタン */
    .next-btn {
      width: 100%; padding: 14px;
      background: var(--btn-active-bg); color: var(--btn-active-text);
      border: none; border-radius: 14px; font-weight: 700;
      font-size: calc(0.92rem * var(--font-scale));
      cursor: pointer; display: none;
      font-family: 'Noto Sans JP',sans-serif;
      transition: opacity 0.2s;
    }
    .next-btn:hover { opacity: 0.85; }

    /* ── 結果画面 ── */
    .result-card {
      background: var(--result-bg); border: 1px solid var(--border);
      border-radius: 24px; padding: 28px 20px; text-align: center;
    }
    .result-title {
      font-family: 'Poppins',sans-serif;
      font-size: calc(1.2rem * var(--font-scale)); font-weight: 800;
      background: linear-gradient(90deg, var(--accent), #f0d080, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 20px;
    }
    .result-stats {
      display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .result-stat { text-align: center; }
    .result-stat-num {
      font-family: 'Poppins',sans-serif;
      font-size: calc(1.6rem * var(--font-scale)); font-weight: 800; color: var(--accent);
    }
    .result-stat-label {
      font-size: calc(0.72rem * var(--font-scale)); color: var(--text-muted); margin-top: 2px;
    }
    .result-comment {
      font-size: calc(0.88rem * var(--font-scale)); color: var(--text-secondary);
      line-height: 1.7; margin-bottom: 24px;
    }
    .result-btn {
      padding: 12px 28px; border-radius: 14px; border: none; cursor: pointer;
      font-family: 'Noto Sans JP',sans-serif;
      font-size: calc(0.88rem * var(--font-scale)); font-weight: 700;
      margin: 6px; transition: opacity 0.2s;
    }
    .result-btn:hover { opacity: 0.85; }
    .result-btn-primary { background: var(--btn-active-bg); color: var(--btn-active-text); }
    .result-btn-secondary {
      background: var(--back-btn-bg); color: var(--text-secondary);
      border: 1px solid var(--back-btn-border);
    }

    /* ── 戻るボタン ── */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 28px; padding: 11px 22px; border-radius: 14px;
      background: var(--back-btn-bg); border: 1px solid var(--back-btn-border);
      color: var(--text-secondary); font-size: calc(0.85rem * var(--font-scale));
      font-weight: 600; text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    .back-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }

    /* ── コンボアニメーション ── */
    @keyframes combo-pop {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .combo-msg {
      text-align: center; font-size: calc(1.1rem * var(--font-scale));
      font-weight: 900; color: var(--accent);
      animation: combo-pop 0.45s ease; margin-bottom: 10px; display: none;
    }
  </style>
</head>
<body>

  <!-- ── ヘッダー ── -->
  <header class="site-header">
    <div class="header-logo-row">
      <img src="../../gift-logo.png" alt="GIFTロゴ" class="logo">
      <span class="header-title">Manabi App</span>
    </div>
    <div class="header-sub">一般社団法人GIFT協会</div>
  </header>

  <!-- ── 設定パネル ── -->
  <div class="settings-panel">
    <div class="sp-group">
      <span class="sp-label">ふりがな</span>
      <label class="ruby-switch">
        <input type="checkbox" id="ruby-toggle" checked onchange="setRuby(this.checked)">
        <span class="ruby-track"><span class="ruby-thumb"></span></span>
      </label>
    </div>
    <div class="sp-divider"></div>
    <div class="sp-group">
      <span class="sp-label">文字</span>
      <div class="sp-btn-group">
        <button class="sp-btn" id="fs-s" onclick="setFontSize('normal')">S</button>
        <button class="sp-btn" id="fs-m" onclick="setFontSize('large')">M</button>
        <button class="sp-btn" id="fs-l" onclick="setFontSize('xlarge')">L</button>
      </div>
    </div>
    <div class="sp-divider"></div>
    <div class="sp-group">
      <span class="sp-label">テーマ</span>
      <div class="sp-btn-group">
        <button class="sp-btn" id="theme-dark"  onclick="setTheme('dark')">🌙</button>
        <button class="sp-btn" id="theme-light" onclick="setTheme('light')">☀️</button>
      </div>
    </div>
  </div>

  <!-- ── メインコンテンツ ── -->
  <main class="main-wrap">

    <!-- ═══ カテゴリ選択画面 ═══ -->
    <div id="screen-category">
      <div class="screen-title">
        <div class="screen-title-en">N1 DOKKAI</div>
        <div class="screen-title-ruby">どっかい　　　　　　　　　せんたく</div>
        <div class="screen-title-ja">📖 N1 読解 ー カテゴリ選択</div>
      </div>

      <!-- プロフィール＋レーダーチャート -->
      <div class="profile-box">
        <div class="profile-box-title">
          📊 あなたの<ruby>読解<rt>どっかい</rt></ruby>プロフィール
        </div>
        <div id="profile-content">
          <div class="profile-empty">問題を解くと得意・苦手が見えてきます</div>
        </div>
      </div>

      <!-- ローディング -->
      <div id="loading-msg">⏳ <strong>問題</strong>データを読み込み中...</div>

      <!-- カテゴリカード一覧（CSVロード後に動的生成） -->
      <div class="cat-grid" id="cat-grid"></div>
    </div>

    <!-- ═══ クイズ画面 ═══ -->
    <div id="screen-quiz">
      <div class="quiz-header">
        <span class="quiz-cat-label" id="quiz-cat-label"></span>
        <span class="quiz-counter" id="quiz-counter">1 / —</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="timer-streak-row">
        <div class="timer-box">⏱ <span class="timer-label" id="timer-disp">0:00</span></div>
        <span class="speed-badge" id="speed-badge"></span>
        <div class="streak-box">🔥 <span id="streak-disp">0</span></div>
      </div>
      <div class="combo-msg" id="combo-msg">🎉 3問連続正解！</div>
      <div class="question-card">
        <div class="question-passage" id="question-passage"></div>
        <div class="question-stem" id="question-stem"></div>
      </div>
      <ul class="choices-list" id="choices-list"></ul>
      <div class="explain-box" id="explain-box">
        <div class="explain-label">💡 解説</div>
        <div class="explain-text" id="explain-text"></div>
      </div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ →</button>
      <div style="text-align:center;">
        <a href="./index.html" class="back-btn">← N1 科目<ruby>選択<rt>せんたく</rt></ruby>にもどる</a>
      </div>
    </div>

    <!-- ═══ 結果画面 ═══ -->
    <div id="screen-result">
      <div class="result-card">
        <div class="result-title">📊 セッション結果</div>
        <div class="result-stats">
          <div class="result-stat">
            <div class="result-stat-num" id="res-correct">—</div>
            <div class="result-stat-label">正解</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num" id="res-total">—</div>
            <div class="result-stat-label">問題数</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num" id="res-rate">—</div>
            <div class="result-stat-label">正答率</div>
          </div>
          <div class="result-stat">
            <div class="result-stat-num" id="res-avg-time">—</div>
            <div class="result-stat-label">平均タイム</div>
          </div>
        </div>
        <div class="result-comment" id="res-comment"></div>
        <div>
          <button class="result-btn result-btn-primary" onclick="retryCategory()">もう一度</button>
          <button class="result-btn result-btn-secondary" onclick="showCategory()">カテゴリ選択へ</button>
        </div>
      </div>
      <div style="text-align:center;">
        <a href="./index.html" class="back-btn">← N1 科目<ruby>選択<rt>せんたく</rt></ruby>にもどる</a>
      </div>
    </div>

  </main>

  <script>
    /* ════════════════════════════════════════════
       データソース（Googleスプレッドシート公開URL）
    ════════════════════════════════════════════ */
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQICFkiQroLHl4oJGUHtp_tfTwOFAO_IDKBJf6FkmsaD5_o7RNcTBv0thoZ4RlM2Cv1QCXeikHkYfow/pub?output=csv';

    /* ════════════════════════════════════════════
       定数・カテゴリ設定
    ════════════════════════════════════════════ */
    const CATEGORIES = [
      { key:'tanbun', name:'内容理解（短文）', emoji:'📄', count:50, baseTimeSec:90  },
      { key:'chubun', name:'内容理解（中文）', emoji:'📃', count:27, baseTimeSec:180 },
      { key:'chobun', name:'内容理解（長文）', emoji:'📜', count:20, baseTimeSec:240 },
      { key:'togo',   name:'統合理解',         emoji:'🔗', count:18, baseTimeSec:210 },
      { key:'shucho', name:'主張理解（長文）', emoji:'💬', count:20, baseTimeSec:240 },
      { key:'joho',   name:'情報検索',         emoji:'🔍', count:12, baseTimeSec:120 },
    ];
    const CAT_MAP = Object.fromEntries(CATEGORIES.map(c => [c.key, c]));

    /* CSV列インデックス（0始まり） */
    const COL = { daimon:0, theme:1, num:2, question:3, c1:4, c2:5, c3:6, c4:7, answer:8, explain:9 };

    /* 大問名キーワード → カテゴリキー（統合理解を追加） */
    const DAIMON_TO_KEY = {
      '短文': 'tanbun',
      '中文': 'chubun',
      '長文': 'chobun',
      '統合': 'togo',
      '主張': 'shucho',
      '情報': 'joho',
    };

    /* ════════════════════════════════════════════
       状態変数
    ════════════════════════════════════════════ */
    let allData       = {};
    let currentCat    = null;
    let questions     = [];
    let qIndex        = 0;
    let streak        = 0;
    let timerInterval = null;
    let startTime     = 0;
    let sessionResults= [];
    let radarChart    = null;

    /* ════════════════════════════════════════════
       設定パネル関数
    ════════════════════════════════════════════ */
    function applySettings() {
      const fs    = localStorage.getItem('gift_fontsize') || 'normal';
      const theme = localStorage.getItem('gift_theme')    || 'dark';
      const ruby  = localStorage.getItem('gift_ruby')     || 'on';
      document.documentElement.setAttribute('data-fontsize', fs);
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-ruby', ruby);
      document.querySelectorAll('.sp-btn[id^="fs-"]').forEach(b => b.classList.remove('active'));
      const fsMap = { normal:'fs-s', large:'fs-m', xlarge:'fs-l' };
      document.getElementById(fsMap[fs])?.classList.add('active');
      document.getElementById('theme-dark') ?.classList.toggle('active', theme === 'dark');
      document.getElementById('theme-light')?.classList.toggle('active', theme === 'light');
      const cb = document.getElementById('ruby-toggle');
      if (cb) cb.checked = (ruby === 'on');
    }
    function setFontSize(size) { localStorage.setItem('gift_fontsize', size); applySettings(); }
    function setTheme(theme)   { localStorage.setItem('gift_theme', theme);   applySettings(); }
    function setRuby(on) {
      localStorage.setItem('gift_ruby', on ? 'on' : 'off');
      document.documentElement.setAttribute('data-ruby', on ? 'on' : 'off');
    }

    /* ════════════════════════════════════════════
       CSV 読み込み（Googleスプレッドシートから直接fetch）
    ════════════════════════════════════════════ */
    async function loadCSV() {
      try {
        const res = await fetch(CSV_URL);
        if (!res.ok) throw new Error('fetch failed');
        const text = await res.text();
        parseCSV(text);
      } catch(e) {
        document.getElementById('loading-msg').textContent =
          '⚠️ 問題データの読み込みに失敗しました。時間をおいて再度お試しください。';
      }
    }

    function parseCSV(raw) {
      const text  = raw.replace(/^\uFEFF/, ''); /* BOM除去 */
      const lines = splitCSVLines(text);
      if (lines.length < 2) return;

      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        if (cols.length < 9) continue;
        const daimon = cols[COL.daimon].trim();
        let catKey = null;
        for (const [kw, k] of Object.entries(DAIMON_TO_KEY)) {
          if (daimon.includes(kw)) { catKey = k; break; }
        }
        if (!catKey) continue;
        if (!allData[catKey]) allData[catKey] = [];
        allData[catKey].push({
          daimon,
          theme:   cols[COL.theme],
          num:     cols[COL.num],
          question:cols[COL.question],
          choices: [cols[COL.c1], cols[COL.c2], cols[COL.c3], cols[COL.c4]],
          answer:  parseInt(cols[COL.answer], 10),
          explain: cols[COL.explain] || '',
        });
      }
      document.getElementById('loading-msg').style.display = 'none';
      renderCategoryCards();
      renderProfile();
    }

    function splitCSVLines(text) {
      const lines = []; let cur = ''; let inQ = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch === '"') { inQ = !inQ; cur += ch; }
        else if (ch === '\n' && !inQ) { lines.push(cur); cur = ''; }
        else { cur += ch; }
      }
      if (cur) lines.push(cur);
      return lines;
    }

    function parseCSVLine(line) {
      const fields = []; let cur = ''; let inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQ && line[i+1] === '"') { cur += '"'; i++; }
          else { inQ = !inQ; }
        } else if (ch === ',' && !inQ) {
          fields.push(cur.trim()); cur = '';
        } else { cur += ch; }
      }
      fields.push(cur.trim());
      return fields;
    }

    /* ════════════════════════════════════════════
       カテゴリカード描画
    ════════════════════════════════════════════ */
    function renderCategoryCards() {
      const grid = document.getElementById('cat-grid');
      grid.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const rows    = allData[cat.key] || [];
        const results = loadResults(cat.key);
        const { badge, badgeClass } = calcBadge(results, rows.length);
        const card = document.createElement('div');
        card.className = 'cat-card';
        card.onclick = () => startCategory(cat.key);
        card.innerHTML = `
          <div class="cat-card-icon">${cat.emoji}</div>
          <div class="cat-card-body">
            <div class="cat-card-name">${cat.name}</div>
            <div class="cat-card-meta">${rows.length}問 ／ 目安 ${formatSec(cat.baseTimeSec)}/問</div>
          </div>
          <div class="cat-card-badge ${badgeClass}">${badge}</div>
        `;
        grid.appendChild(card);
      });
    }

    function calcBadge(results, total) {
      const answered = Object.keys(results).length;
      if (answered === 0) return { badge: 'NEW', badgeClass: 'new' };
      const correct = Object.values(results).filter(r => r.correct).length;
      const rate = Math.round(correct / answered * 100);
      if (rate >= 70) return { badge: `${rate}% 😊`, badgeClass: 'good' };
      if (rate >= 40) return { badge: `${rate}% 📝`, badgeClass: '' };
      return { badge: `${rate}% 💪`, badgeClass: 'weak' };
    }

    /* ════════════════════════════════════════════
       プロフィール（レーダーチャート）
    ════════════════════════════════════════════ */
    function renderProfile() {
      const hasAny = CATEGORIES.some(c => Object.keys(loadResults(c.key)).length > 0);
      if (!hasAny) return;
      const labels = [], data = [];
      CATEGORIES.forEach(cat => {
        const results  = loadResults(cat.key);
        const answered = Object.keys(results).length;
        const correct  = Object.values(results).filter(r => r.correct).length;
        labels.push(cat.name.replace('内容理解（','').replace('）','').replace('内容理解',''));
        data.push(answered > 0 ? Math.round(correct / answered * 100) : 0);
      });
      document.getElementById('profile-content').innerHTML =
        '<div class="radar-wrap"><canvas id="radar-chart"></canvas></div>';
      const ctx = document.getElementById('radar-chart').getContext('2d');
      if (radarChart) radarChart.destroy();
      radarChart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels,
          datasets: [{
            label: '正答率(%)', data,
            backgroundColor: 'rgba(201,151,58,0.20)',
            borderColor: 'rgba(201,151,58,0.80)',
            pointBackgroundColor: 'rgba(201,151,58,1)',
            borderWidth: 2,
          }]
        },
        options: {
          responsive: true,
          scales: { r: {
            min:0, max:100, ticks:{ stepSize:20, display:false },
            grid:{ color:'rgba(255,255,255,0.1)' },
            pointLabels:{ font:{ size:10 }, color:'rgba(240,236,224,0.70)' }
          }},
          plugins: { legend:{ display:false } }
        }
      });
    }

    /* ════════════════════════════════════════════
       クイズ開始
    ════════════════════════════════════════════ */
    function startCategory(catKey) {
      currentCat     = catKey;
      questions      = shuffle([...(allData[catKey] || [])]);
      qIndex         = 0;
      streak         = 0;
      sessionResults = [];
      showScreen('quiz');
      showQuestion();
    }

    function showQuestion() {
      if (qIndex >= questions.length) { showResult(); return; }
      const q   = questions[qIndex];
      const cat = CAT_MAP[currentCat];

      document.getElementById('quiz-cat-label').textContent = cat.name;
      document.getElementById('quiz-counter').textContent   = `${qIndex + 1} / ${questions.length}`;
      document.getElementById('progress-fill').style.width  = `${(qIndex / questions.length) * 100}%`;
      document.getElementById('streak-disp').textContent    = streak;
      document.getElementById('combo-msg').style.display    = 'none';

      /* 本文と設問を【問】で分割 */
      const raw = q.question;
      const markerIdx = raw.indexOf('【問】');
      let passage = '', stem = '';
      if (markerIdx !== -1) {
        passage = raw.slice(0, markerIdx).trim();
        stem    = raw.slice(markerIdx).trim();
      } else {
        stem = raw.trim();
      }
      document.getElementById('question-passage').textContent = passage;
      document.getElementById('question-stem').textContent    = stem;

      /* 選択肢 */
      const list = document.getElementById('choices-list');
      list.innerHTML = '';
      q.choices.forEach((text, i) => {
        const li  = document.createElement('li');
        const btn = document.createElement('button');
        btn.className   = 'choice-btn';
        btn.textContent = `${i + 1}．${text}`;
        btn.onclick = () => selectAnswer(i + 1, q, btn, list);
        li.appendChild(btn);
        list.appendChild(li);
      });

      document.getElementById('explain-box').style.display = 'none';
      document.getElementById('next-btn').style.display    = 'none';
      document.getElementById('speed-badge').style.display = 'none';

      /* タイマー開始 */
      clearInterval(timerInterval);
      startTime = Date.now();
      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    /* ════════════════════════════════════════════
       回答処理
    ════════════════════════════════════════════ */
    function selectAnswer(chosen, q, clickedBtn, list) {
      clearInterval(timerInterval);
      const elapsed = Math.round((Date.now() - startTime) / 1000);
      const correct = (chosen === q.answer);

      list.querySelectorAll('.choice-btn').forEach((b, i) => {
        b.disabled = true;
        if (i + 1 === q.answer) b.classList.add('correct');
        else if (b === clickedBtn && !correct) b.classList.add('wrong');
      });

      if (correct) {
        streak++;
        if (streak % 3 === 0) {
          const comboEl = document.getElementById('combo-msg');
          comboEl.textContent = `🎉 ${streak}問連続正解！`;
          comboEl.style.display = 'block';
          setTimeout(() => { comboEl.style.display = 'none'; }, 2000);
        }
      } else { streak = 0; }
      document.getElementById('streak-disp').textContent = streak;

      /* スピードバッジ */
      const cat   = CAT_MAP[currentCat];
      const badge = document.getElementById('speed-badge');
      badge.style.display = 'inline-block';
      if      (elapsed <= cat.baseTimeSec * 0.7) { badge.className='speed-badge fast';   badge.textContent=`⚡ ${elapsed}秒 速い！`; }
      else if (elapsed <= cat.baseTimeSec * 1.3) { badge.className='speed-badge normal'; badge.textContent=`✅ ${elapsed}秒 普通`; }
      else                                        { badge.className='speed-badge slow';   badge.textContent=`🐢 ${elapsed}秒 もう少し`; }

      document.getElementById('explain-text').textContent = q.explain || '（解説なし）';
      document.getElementById('explain-box').style.display = 'block';
      document.getElementById('next-btn').style.display    = 'block';

      saveResult(currentCat, q.num, correct, elapsed);
      sessionResults.push({ correct, sec: elapsed });
    }

    /* ════════════════════════════════════════════
       タイマー
    ════════════════════════════════════════════ */
    function updateTimer() {
      const elapsed = Math.round((Date.now() - startTime) / 1000);
      document.getElementById('timer-disp').textContent = formatSec(elapsed);
    }
    function formatSec(s) {
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2,'0')}`;
    }

    /* ════════════════════════════════════════════
       次の問題・結果
    ════════════════════════════════════════════ */
    function nextQuestion() { qIndex++; showQuestion(); }

    function showResult() {
      showScreen('result');
      const total   = sessionResults.length;
      const correct = sessionResults.filter(r => r.correct).length;
      const rate    = total > 0 ? Math.round(correct / total * 100) : 0;
      const avgTime = total > 0 ? Math.round(sessionResults.reduce((a,r) => a + r.sec, 0) / total) : 0;
      document.getElementById('res-correct').textContent  = correct;
      document.getElementById('res-total').textContent    = total;
      document.getElementById('res-rate').textContent     = `${rate}%`;
      document.getElementById('res-avg-time').textContent = formatSec(avgTime);
      let comment = '';
      if      (rate >= 80) comment = '🌟 素晴らしい！このカテゴリはかなり得意ですね。';
      else if (rate >= 60) comment = '📈 着実に力がついています。あと少しで安定圏内！';
      else if (rate >= 40) comment = '💪 まだ伸びしろがあります。解説を読んで復習しましょう。';
      else                 comment = '📖 焦らず、まず本文をゆっくり読む練習をしましょう。';
      document.getElementById('res-comment').textContent = comment;
    }

    function retryCategory() { startCategory(currentCat); }
    function showCategory()  { showScreen('category'); renderCategoryCards(); renderProfile(); }

    /* ════════════════════════════════════════════
       画面切替
    ════════════════════════════════════════════ */
    function showScreen(name) {
      document.getElementById('screen-category').style.display = name==='category' ? 'block' : 'none';
      document.getElementById('screen-quiz')    .style.display = name==='quiz'     ? 'block' : 'none';
      document.getElementById('screen-result')  .style.display = name==='result'   ? 'block' : 'none';
    }

    /* ════════════════════════════════════════════
       localStorage ユーティリティ
    ════════════════════════════════════════════ */
    function saveResult(catKey, qNum, correct, sec) {
      const key  = `jlpt_n1_results_${catKey}`;
      const data = JSON.parse(localStorage.getItem(key) || '{}');
      data[qNum] = { correct, sec, ts: Date.now() };
      localStorage.setItem(key, JSON.stringify(data));
    }
    function loadResults(catKey) {
      return JSON.parse(localStorage.getItem(`jlpt_n1_results_${catKey}`) || '{}');
    }

    /* ════════════════════════════════════════════
       シャッフル（Fisher-Yates）
    ════════════════════════════════════════════ */
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    /* ════════════════════════════════════════════
       初期化
    ════════════════════════════════════════════ */
    document.addEventListener('DOMContentLoaded', () => {
      applySettings();
      loadCSV();
    });
  </script>
