<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N1 読解練習｜学びアプリ｜一般社団法人GIFT協会</title>
  <meta name="description" content="JLPT N1読解練習。6カテゴリ147問。">
  <link rel="icon" href="../../gift-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Chart.js（レーダーチャート用） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script>
    /* ─── 設定の即時適用（フラッシュ防止） ─── */
    (function(){
      const theme    = localStorage.getItem('gift_theme')    || 'dark';
      const fontsize = localStorage.getItem('gift_fontsize') || 'normal';
      const ruby     = localStorage.getItem('gift_ruby')     || 'on';
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-fontsize', fontsize);
      document.documentElement.setAttribute('data-ruby', ruby);
    })();
  </script>

  <style>
    /* ═══════════════════════════════════════
       CSS変数
    ═══════════════════════════════════════ */
    :root { --font-scale: 1; }
    html[data-fontsize="normal"] { --font-scale: 1; }
    html[data-fontsize="large"]  { --font-scale: 1.125; }
    html[data-fontsize="xlarge"] { --font-scale: 1.25; }

    html[data-theme="dark"] {
      --bg-start:#0e0d1a; --bg-mid:#1a1830; --bg-end:#0e0d1a;
      --surface:rgba(255,255,255,0.05); --surface-2:rgba(255,255,255,0.08);
      --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.20);
      --text-primary:#f0ece0; --text-secondary:rgba(240,236,224,0.65); --text-muted:rgba(240,236,224,0.40);
      --accent:#c9973a; --accent-glow:rgba(201,151,58,0.25);
      --panel-bg:rgba(20,18,35,0.90); --panel-border:rgba(201,151,58,0.30);
      --btn-inactive:rgba(255,255,255,0.07); --btn-inactive-text:rgba(240,236,224,0.55);
      --btn-active-bg:linear-gradient(135deg,#b8863a,#c9973a); --btn-active-text:#fff;
      --tab-active-bg:linear-gradient(135deg,#b8863a,#c9973a);
      --choice-bg:rgba(255,255,255,0.06); --choice-hover:rgba(255,255,255,0.11);
      --choice-correct:rgba(74,222,128,0.20); --choice-correct-border:rgba(74,222,128,0.60);
      --choice-wrong:rgba(248,113,113,0.20);  --choice-wrong-border:rgba(248,113,113,0.60);
      --explain-bg:rgba(201,151,58,0.10); --explain-border:rgba(201,151,58,0.30);
      --progress-bg:rgba(255,255,255,0.08); --progress-fill:linear-gradient(90deg,#b8863a,#c9973a);
      --streak-bg:rgba(201,151,58,0.15); --streak-border:rgba(201,151,58,0.35);
      --back-btn-bg:rgba(255,255,255,0.07); --back-btn-border:rgba(255,255,255,0.15);
    }

    html[data-theme="light"] {
      --bg-start:#f2ede4; --bg-mid:#ede6d8; --bg-end:#e8dfd0;
      --surface:rgba(255,255,255,0.65); --surface-2:rgba(255,255,255,0.85);
      --border:rgba(150,120,70,0.18); --border-strong:rgba(150,120,70,0.35);
      --text-primary:#3a2e1e; --text-secondary:rgba(58,46,30,0.72); --text-muted:rgba(58,46,30,0.45);
      --accent:#9a6c1e; --accent-glow:rgba(154,108,30,0.20);
      --panel-bg:rgba(245,240,230,0.95); --panel-border:rgba(154,108,30,0.30);
      --btn-inactive:rgba(180,150,100,0.15); --btn-inactive-text:rgba(58,46,30,0.55);
      --btn-active-bg:linear-gradient(135deg,#9a6c1e,#b8863a); --btn-active-text:#fff;
      --tab-active-bg:linear-gradient(135deg,#9a6c1e,#b8863a);
      --choice-bg:rgba(255,255,255,0.70); --choice-hover:rgba(255,255,255,0.90);
      --choice-correct:rgba(74,222,128,0.18); --choice-correct-border:rgba(34,197,94,0.55);
      --choice-wrong:rgba(248,113,113,0.18);  --choice-wrong-border:rgba(239,68,68,0.55);
      --explain-bg:rgba(154,108,30,0.08); --explain-border:rgba(154,108,30,0.30);
      --progress-bg:rgba(150,120,70,0.12); --progress-fill:linear-gradient(90deg,#9a6c1e,#b8863a);
      --streak-bg:rgba(154,108,30,0.10); --streak-border:rgba(154,108,30,0.30);
      --back-btn-bg:rgba(150,120,70,0.12); --back-btn-border:rgba(150,120,70,0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: calc(16px * var(--font-scale));
      background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
      min-height: 100vh;
      color: var(--text-primary);
      transition: background 0.4s, color 0.4s;
      padding-bottom: 80px;
    }

    html[data-ruby="off"] ruby rt { display: none; }

    /* ═══════════════════════════════════════
       ヘッダー
    ═══════════════════════════════════════ */
    .site-header {
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 20px 12px; gap: 3px;
    }
    .header-logo-row { display: flex; align-items: center; gap: 10px; }
    .header-logo-row img.logo { width: 30px; height: 30px; object-fit: contain; }
    .header-title {
      font-family: 'Poppins','Noto Sans JP',sans-serif;
      font-size: calc(1.0rem * var(--font-scale)); font-weight: 800;
      background: linear-gradient(90deg, var(--accent), #f0d080, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .header-sub { font-size: calc(0.60rem * var(--font-scale)); color: var(--text-muted); }

    /* ═══════════════════════════════════════
       設定パネル
    ═══════════════════════════════════════ */
    .settings-panel {
      width: calc(100% - 32px); max-width: 640px; margin: 0 auto 16px;
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 16px; padding: 8px 14px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: flex; flex-wrap: nowrap; align-items: center; gap: 10px;
      overflow-x: auto; scrollbar-width: none;
    }
    .settings-panel::-webkit-scrollbar { display: none; }
    .sp-group { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .sp-label { font-size: calc(0.62rem * var(--font-scale)); color: var(--text-muted); white-space: nowrap; }
    .sp-divider { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
    .ruby-switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; flex-shrink: 0; }
    .ruby-switch input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
    .ruby-track {
      width: 42px; height: 22px; background: var(--btn-inactive);
      border: 1.5px solid var(--border); border-radius: 11px; position: relative;
      transition: background 0.3s, border-color 0.3s;
    }
    .ruby-thumb {
      position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
      background: var(--btn-inactive-text); border-radius: 50%;
      transition: transform 0.3s, background 0.3s;
    }
    .ruby-switch input:checked ~ .ruby-track { background: linear-gradient(135deg,#b8863a,#c9973a); border-color: var(--accent); }
    .ruby-switch input:checked ~ .ruby-track .ruby-thumb { transform: translateX(20px); background: #fff; }
    .sp-btn-group { display: flex; gap: 4px; flex-shrink: 0; }
    .sp-btn {
      padding: 3px 8px; border-radius: 8px; border: 1.5px solid transparent;
      background: var(--btn-inactive); color: var(--btn-inactive-text);
      font-family: 'Poppins','Noto Sans JP',sans-serif;
      font-size: calc(0.65rem * var(--font-scale)); font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: all 0.2s;
    }
    .sp-btn.active { background: var(--btn-active-bg); color: var(--btn-active-text); border-color: var(--accent); box-shadow: 0 2px 8px var(--accent-glow); }

    /* ═══════════════════════════════════════
       メインラッパー
    ═══════════════════════════════════════ */
    .main-wrap {
      width: calc(100% - 32px);
      max-width: 640px;
      margin: 0 auto;
    }

    /* ═══════════════════════════════════════
       カテゴリ選択画面
    ═══════════════════════════════════════ */
    #screen-category { display: block; }
    #screen-quiz     { display: none; }
    #screen-result   { display: none; }

    .screen-title {
      text-align: center; margin-bottom: 24px; padding-top: 8px;
    }
    .screen-title-en {
      font-family: 'Poppins', sans-serif;
      font-size: calc(0.65rem * var(--font-scale));
      font-weight: 700; letter-spacing: .22em;
      color: var(--accent); opacity: .7; margin-bottom: 4px;
    }
    .screen-title-ja {
      font-family: 'Poppins','Noto Sans JP',sans-serif;
      font-size: clamp(1.2rem, 5vw, calc(1.5rem * var(--font-scale)));
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), #f0d080, var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    /* カテゴリカード */
    .cat-grid {
      display: flex; flex-direction: column; gap: 12px;
      margin-bottom: 28px;
    }
    .cat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px 20px;
      cursor: pointer; transition: transform .2s, box-shadow .2s, border-color .2s;
      backdrop-filter: blur(10px);
    }
    .cat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.20); border-color: var(--accent); }
    .cat-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .cat-card-name {
      font-size: calc(1.0rem * var(--font-scale));
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), #f0d080);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .cat-card-meta {
      display: flex; align-items: center; gap: 8px;
    }
    .cat-card-total {
      font-size: calc(0.68rem * var(--font-scale));
      color: var(--text-muted);
    }
    /* 正答率バッジ */
    .rate-badge {
      font-size: calc(0.65rem * var(--font-scale));
      font-weight: 700; padding: 2px 10px; border-radius: 20px;
    }
    .rate-badge-high   { background:rgba(74,222,128,0.18); color:#4ade80; border:1px solid rgba(74,222,128,0.40); }
    .rate-badge-mid    { background:rgba(250,204,21,0.18); color:#facc15; border:1px solid rgba(250,204,21,0.40); }
    .rate-badge-low    { background:rgba(248,113,113,0.18); color:#f87171; border:1px solid rgba(248,113,113,0.40); }
    .rate-badge-none   { background:var(--btn-inactive); color:var(--text-muted); border:1px solid var(--border); }
    /* 制覇バッジ */
    .master-badge {
      font-size: calc(0.62rem * var(--font-scale));
      font-weight: 800; padding: 2px 8px; border-radius: 20px;
      background: linear-gradient(90deg,#c9973a,#f0d080); color: #fff;
    }
    /* 進捗バー */
    .cat-progress-bar {
      width: 100%; height: 4px;
      background: var(--progress-bg); border-radius: 10px; overflow: hidden;
    }
    .cat-progress-fill {
      height: 100%; background: var(--progress-fill);
      border-radius: 10px; transition: width .5s ease;
    }

    /* ═══════════════════════════════════════
       レーダーチャートエリア
    ═══════════════════════════════════════ */
    .chart-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    .chart-title {
      font-size: calc(0.72rem * var(--font-scale));
      font-weight: 700; color: var(--accent);
      letter-spacing: .06em; margin-bottom: 4px; text-align: center;
    }
    .chart-comment {
      font-size: calc(0.70rem * var(--font-scale));
      color: var(--text-secondary); text-align: center;
      margin-bottom: 14px; line-height: 1.5;
    }
    .chart-wrap {
      max-width: 260px; margin: 0 auto;
    }

    /* ═══════════════════════════════════════
       問題画面（quiz）
    ═══════════════════════════════════════ */

    /* カテゴリタブ（横スクロール） */
    .tab-bar {
      display: flex; gap: 8px;
      overflow-x: auto; scrollbar-width: none;
      padding-bottom: 4px; margin-bottom: 16px;
    }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0; padding: 6px 14px;
      border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--btn-inactive); color: var(--btn-inactive-text);
      font-family: 'Noto Sans JP',sans-serif;
      font-size: calc(0.70rem * var(--font-scale)); font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: all .2s;
    }
    .tab-btn.active {
      background: var(--tab-active-bg); color: #fff;
      border-color: var(--accent); box-shadow: 0 2px 10px var(--accent-glow);
    }

    /* 問題ヘッダー（番号・タイマー・ストリーク） */
    .quiz-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }
    .quiz-num {
      font-family: 'Poppins', sans-serif;
      font-size: calc(0.78rem * var(--font-scale));
      font-weight: 700; color: var(--text-muted);
    }
    .quiz-num span { color: var(--accent); font-size: calc(1.0rem * var(--font-scale)); }

    /* タイマー */
    .timer-wrap {
      display: flex; align-items: center; gap: 6px;
    }
    .timer-icon { font-size: .9rem; }
    .timer-display {
      font-family: 'Poppins', sans-serif;
      font-size: calc(0.82rem * var(--font-scale));
      font-weight: 700; color: var(--text-secondary);
      min-width: 48px;
    }
    /* タイムラベル（速い/普通/もう少し） */
    .time-label {
      font-size: calc(0.65rem * var(--font-scale));
      font-weight: 700; padding: 2px 8px; border-radius: 20px;
      opacity: 0; transition: opacity .3s;
    }
    .time-label.show { opacity: 1; }
    .time-label-fast { background:rgba(74,222,128,0.20); color:#4ade80; }
    .time-label-mid  { background:rgba(250,204,21,0.18); color:#facc15; }
    .time-label-slow { background:rgba(248,113,113,0.18); color:#f87171; }

    /* ストリーク */
    .streak-wrap {
      display: flex; align-items: center; gap: 4px;
      background: var(--streak-bg); border: 1px solid var(--streak-border);
      border-radius: 20px; padding: 3px 10px;
    }
    .streak-icon { font-size: .85rem; }
    .streak-num {
      font-family: 'Poppins', sans-serif;
      font-size: calc(0.75rem * var(--font-scale));
      font-weight: 800; color: var(--accent);
    }

    /* 全体進捗バー（問題画面上部） */
    .quiz-progress-bar {
      width: 100%; height: 4px;
      background: var(--progress-bg); border-radius: 10px;
      overflow: hidden; margin-bottom: 16px;
    }
    .quiz-progress-fill {
      height: 100%; background: var(--progress-fill);
      border-radius: 10px; transition: width .4s ease;
    }

    /* 問題カード */
    .question-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 20px;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
    }
    .question-theme {
      font-size: calc(0.65rem * var(--font-scale));
      color: var(--accent); font-weight: 700;
      letter-spacing: .08em; margin-bottom: 10px;
    }
    /* 本文テキスト */
    .question-body {
      font-size: calc(0.88rem * var(--font-scale));
      line-height: 1.85; color: var(--text-primary);
      margin-bottom: 14px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    /* 本文と設問の区切り */
    .question-divider {
      border: none; border-top: 1px dashed var(--border-strong);
      margin: 14px 0;
    }
    /* 設問テキスト */
    .question-text {
      font-size: calc(0.88rem * var(--font-scale));
      font-weight: 700; line-height: 1.65;
      color: var(--text-primary); margin-bottom: 16px;
    }

    /* 選択肢 */
    .choices { display: flex; flex-direction: column; gap: 10px; }
    .choice-btn {
      width: 100%; text-align: left;
      background: var(--choice-bg); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 14px 16px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: calc(0.85rem * var(--font-scale));
      color: var(--text-primary); cursor: pointer;
      transition: background .2s, border-color .2s, transform .15s;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .choice-btn:hover:not(:disabled) {
      background: var(--choice-hover);
      border-color: var(--accent);
      transform: translateX(3px);
    }
    .choice-btn:disabled { cursor: default; }
    /* 正解 */
    .choice-btn.correct {
      background: var(--choice-correct);
      border-color: var(--choice-correct-border);
      animation: correct-flash .4s ease;
    }
    /* 不正解 */
    .choice-btn.wrong {
      background: var(--choice-wrong);
      border-color: var(--choice-wrong-border);
    }
    @keyframes correct-flash {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    /* 選択肢番号 */
    .choice-num {
      flex-shrink: 0; width: 24px; height: 24px;
      border-radius: 50%; border: 1.5px solid var(--border-strong);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Poppins', sans-serif;
      font-size: calc(0.70rem * var(--font-scale)); font-weight: 700;
      color: var(--text-muted);
    }
    .choice-btn.correct .choice-num { border-color: #4ade80; color: #4ade80; }
    .choice-btn.wrong   .choice-num { border-color: #f87171; color: #f87171; }

    /* 解説エリア */
    .explain-box {
      background: var(--explain-bg); border: 1px solid var(--explain-border);
      border-radius: 16px; padding: 16px;
      margin-top: 14px; display: none;
    }
    .explain-box.show { display: block; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .explain-label {
      font-size: calc(0.65rem * var(--font-scale));
      font-weight: 700; color: var(--accent);
      letter-spacing: .08em; margin-bottom: 8px;
    }
    .explain-text {
      font-size: calc(0.82rem * var(--font-scale));
      line-height: 1.75; color: var(--text-secondary);
      white-space: pre-wrap;
    }

    /* 応援メッセージ */
    .cheer-msg {
      text-align: center; font-size: calc(0.80rem * var(--font-scale));
      font-weight: 700; margin: 10px 0 4px;
      min-height: 1.4em;
    }
    .cheer-correct { color: #4ade80; }
    .cheer-wrong   { color: var(--text-secondary); }

    /* ストリークアニメーション */
    .streak-animation {
      text-align: center; font-size: calc(0.88rem * var(--font-scale));
      font-weight: 800; color: var(--accent);
      min-height: 1.4em; transition: opacity .3s;
    }

    /* ナビゲーションボタン */
    .nav-btns {
      display: flex; gap: 10px; margin-top: 16px;
    }
    .nav-btn {
      flex: 1; padding: 13px;
      border-radius: 14px; border: 1.5px solid var(--border);
      background: var(--btn-inactive); color: var(--btn-inactive-text);
      font-family: 'Poppins','Noto Sans JP',sans-serif;
      font-size: calc(0.82rem * var(--font-scale)); font-weight: 700;
      cursor: pointer; transition: all .2s; text-align: center;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
    .nav-btn-primary {
      background: var(--btn-active-bg); color: #fff;
      border-color: var(--accent); box-shadow: 0 3px 12px var(--accent-glow);
    }
    .nav-btn-primary:hover { opacity: .88; }
    .nav-btn:disabled { opacity: .35; cursor: not-allowed; }

    /* ═══════════════════════════════════════
       カテゴリ結果画面
    ═══════════════════════════════════════ */
    .result-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 24px 20px;
      text-align: center; margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }
    .result-score {
      font-family: 'Poppins', sans-serif;
      font-size: calc(3.5rem * var(--font-scale));
      font-weight: 800; line-height: 1;
      background: linear-gradient(90deg, var(--accent), #f0d080);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .result-label {
      font-size: calc(0.78rem * var(--font-scale));
      color: var(--text-muted); margin-top: 4px; margin-bottom: 16px;
    }
    .result-stats {
      display: flex; justify-content: center; gap: 24px;

        <button class="nav-btn nav-btn-primary" onclick="retryCategory()">
          🔄 もう一度このカテゴリ
        </button>
        <button class="back-btn" onclick="showCategoryScreen()" style="justify-content:center;">
          ← カテゴリ選択にもどる
        </button>

  </div><!-- /main-wrap -->


  <!-- ═══ JavaScript ═══ -->
  <script>
  /* ════════════════════════════════════════════════
     設定パネル
  ════════════════════════════════════════════════ */
  function applySettings() {
    const theme    = localStorage.getItem('gift_theme')    || 'dark';
    const fontsize = localStorage.getItem('gift_fontsize') || 'normal';
    const ruby     = localStorage.getItem('gift_ruby')     || 'on';
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-fontsize', fontsize);
    document.documentElement.setAttribute('data-ruby', ruby);
    document.querySelectorAll('.sp-btn[data-size]').forEach(b =>
      b.classList.toggle('active', b.dataset.size === fontsize));
    document.querySelectorAll('.sp-btn[data-theme]').forEach(b =>
      b.classList.toggle('active', b.dataset.theme === theme));
    const rt = document.getElementById('ruby-toggle');
    if (rt) rt.checked = (ruby === 'on');
    /* チャートの色もテーマに合わせて更新 */
    if (window.radarChart) updateChartTheme();
  }
  document.getElementById('ruby-toggle').addEventListener('change', function() {
    const val = this.checked ? 'on' : 'off';
    localStorage.setItem('gift_ruby', val);
    document.documentElement.setAttribute('data-ruby', val);
  });
  function setFontSize(size) {
    localStorage.setItem('gift_fontsize', size);
    document.documentElement.setAttribute('data-fontsize', size);
    document.querySelectorAll('.sp-btn[data-size]').forEach(b =>
      b.classList.toggle('active', b.dataset.size === size));
  }
  function setTheme(t) {
    localStorage.setItem('gift_theme', t);
    document.documentElement.setAttribute('data-theme', t);
    document.querySelectorAll('.sp-btn[data-theme]').forEach(b =>
      b.classList.toggle('active', b.dataset.theme === t));
    if (window.radarChart) updateChartTheme();
  }
  applySettings();

  /* ════════════════════════════════════════════════
     定数・カテゴリ定義
     key は localStorage のキー末尾と CSV の大問名に対応
  ════════════════════════════════════════════════ */
  const CATEGORIES = [
    { key:'tanbun', label:'内容理解（短文）', short:'短文',  total:50, baseTimeSec:90  },
    { key:'chubun', label:'内容理解（中文）', short:'中文',  total:27, baseTimeSec:180 },
    { key:'chobun', label:'内容理解（長文）', short:'長文',  total:20, baseTimeSec:240 },
    { key:'togo',   label:'統合理解',         short:'統合',  total:18, baseTimeSec:210 },
    { key:'shucho', label:'主張理解（長文）', short:'主張',  total:20, baseTimeSec:240 },
    { key:'joho',   label:'情報検索',         short:'情報',  total:12, baseTimeSec:120 },
  ];

  /* CSV の大問名 → カテゴリキー のマッピング */
  const DAIMON_TO_KEY = {
    '内容理解（短文）': 'tanbun',
    '内容理解（中文）': 'chubun',
    '内容理解（長文）': 'chobun',
    '統合理解':         'togo',
    '主張理解（長文）': 'shucho',
    '情報検索':         'joho',
  };

  /* ════════════════════════════════════════════════
     状態変数
  ════════════════════════════════════════════════ */
  let allQuestions    = {};   /* { tanbun:[...], chubun:[...], ... } */
  let currentCatKey   = '';
  let currentQuestions= [];
  let currentIndex    = 0;
  let answered        = false;
  let timerInterval   = null;
  let elapsedSec      = 0;
  let streak          = 0;
  let sessionResults  = []; /* { correct:bool, sec:int } の配列（今セッション分） */

  /* ════════════════════════════════════════════════
     CSV 読み込み・パース
  ════════════════════════════════════════════════ */
  async function loadCSV() {
    try {
      const res  = await fetch('./n1-dokkai.csv');
      if (!res.ok) throw new Error('CSV not found');
      const text = await res.text();
      parseCSV(text);
    } catch(e) {
      document.getElementById('cat-grid').innerHTML =
        '<div class="loading-msg">⚠️ 問題データが見つかりません。<br>n1-dokkai.csv をアップロードしてください。</div>';
    }
  }

  function parseCSV(text) {
    /* BOM除去 */
    const clean = text.replace(/^\uFEFF/, '');
    const lines = clean.split(/\r?\n/).filter(l => l.trim());
    /* 1行目はヘッダーなのでスキップ */
    const rows  = lines.slice(1);

    /* カテゴリ別に振り分け */
    CATEGORIES.forEach(c => { allQuestions[c.key] = []; });

    rows.forEach(line => {
      const cols = parseCSVLine(line);
      if (cols.length < 10) return;
      const [daimon, theme, num, mondai, c1, c2, c3, c4, answer, kaisetsu] = cols;
      const key = DAIMON_TO_KEY[daimon.trim()];
      if (!key) return;

      /* 本文と設問の分割
         「問題」列に本文と【問】設問が含まれる場合は改行で分離
         【問】がない場合は問題列全体を設問として扱う */
      let body = '';
      let qText = mondai.trim();
      const mondaiMarker = /【問】|問　|問\s/;
      const splitIdx = mondai.search(mondaiMarker);
      if (splitIdx > 0) {
        body  = mondai.slice(0, splitIdx).trim();
        qText = mondai.slice(splitIdx).trim();
      }

      allQuestions[key].push({
        id:      key + '_' + num.trim(),
        theme:   theme.trim(),
        body:    body,
        text:    qText,
        choices: [c1.trim(), c2.trim(), c3.trim(), c4.trim()],
        answer:  parseInt(answer.trim(), 10), /* 1〜4 */
        kaisetsu:kaisetsu.trim(),
      });
    });

    /* カテゴリ選択画面を構築 */
    buildCategoryScreen();
    buildRadarChart();
  }

  /* CSVの1行をダブルクォート対応でパース */
  function parseCSVLine(line) {
    const result = [];
    let cur = '';
    let inQ  = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else { inQ = !inQ; }
      } else if (ch === ',' && !inQ) {
        result.push(cur); cur = '';
      } else {
        cur += ch;
      }
    }
    result.push(cur);
    return result;
  }

  /* ════════════════════════════════════════════════
     localStorage ヘルパー
  ════════════════════════════════════════════════ */
  function getResults(key) {
    const raw = localStorage.getItem('jlpt_n1_results_' + key);
    return raw ? JSON.parse(raw) : {};
  }
  function saveResult(key, qId, correct, sec) {
    const results = getResults(key);
    results[qId] = { correct, sec, ts: Date.now() };
    localStorage.setItem('jlpt_n1_results_' + key, JSON.stringify(results));
  }
  function getStreak() {
    return parseInt(localStorage.getItem('jlpt_n1_streak') || '0', 10);
  }
  function saveStreak(n) {
    localStorage.setItem('jlpt_n1_streak', String(n));
  }

  /* ════════════════════════════════════════════════
     カテゴリ選択画面 構築
  ════════════════════════════════════════════════ */
  function buildCategoryScreen() {
    const grid = document.getElementById('cat-grid');
    grid.innerHTML = '';
    streak = getStreak();

    CATEGORIES.forEach(cat => {
      const results  = getResults(cat.key);
      const attempted= Object.keys(results).length;
      const correct  = Object.values(results).filter(r => r.correct).length;
      const rate     = attempted > 0 ? Math.round((correct / attempted) * 100) : -1;
      const mastered = attempted >= cat.total;
      const pct      = Math.min(100, Math.round((attempted / cat.total) * 100));

      /* 正答率バッジ */
      let badgeHtml = '';
      if (mastered) {
        badgeHtml = '<span class="master-badge">👑 制覇</span>';
      } else if (rate >= 70) {
        badgeHtml = `<span class="rate-badge rate-badge-high">${rate}%</span>`;
      } else if (rate >= 40) {
        badgeHtml = `<span class="rate-badge rate-badge-mid">${rate}%</span>`;
      } else if (rate >= 0) {
        badgeHtml = `<span class="rate-badge rate-badge-low">${rate}%</span>`;
      } else {
        badgeHtml = '<span class="rate-badge rate-badge-none">未挑戦</span>';
      }

      const card = document.createElement('div');
      card.className = 'cat-card';
      card.innerHTML = `
        <div class="cat-card-header">
          <span class="cat-card-name">${cat.label}</span>
          <div class="cat-card-meta">
            <span class="cat-card-total">${attempted}/${cat.total}問</span>
            ${badgeHtml}
          </div>
        </div>
        <div class="cat-progress-bar">
          <div class="cat-progress-fill" style="width:${pct}%"></div>
        </div>
      `;
      card.addEventListener('click', () => startCategory(cat.key));
      grid.appendChild(card);
    });
  }

  /* ════════════════════════════════════════════════
     レーダーチャート
  ════════════════════════════════════════════════ */
  let radarChart = null;

  function getChartColors() {
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    return {
      line:  dark ? 'rgba(201,151,58,0.80)' : 'rgba(154,108,30,0.80)',
      fill:  dark ? 'rgba(201,151,58,0.18)' : 'rgba(154,108,30,0.15)',
      grid:  dark ? 'rgba(255,255,255,0.10)' : 'rgba(100,80,40,0.15)',
      tick:  dark ? 'rgba(240,236,224,0.45)' : 'rgba(58,46,30,0.50)',
      point: dark ? '#c9973a' : '#9a6c1e',
    };
  }

  function buildRadarChart() {
    const labels = CATEGORIES.map(c => c.short);
    const data   = CATEGORIES.map(cat => {
      const results  = getResults(cat.key);
      const attempted= Object.keys(results).length;
      const correct  = Object.values(results).filter(r => r.correct).length;
      return attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
    });

    const colors = getChartColors();
    const ctx    = document.getElementById('radar-chart').getContext('2d');

    radarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels,
        datasets: [{
          label: '正答率 (%)',
          data,
          borderColor:     colors.line,
          backgroundColor: colors.fill,
          pointBackgroundColor: colors.point,
          pointRadius: 4,
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        scales: {
          r: {
            min: 0, max: 100, ticks: { stepSize: 25, display: false },
            grid:        { color: colors.grid },
            pointLabels: { color: colors.tick, font: { size: 11, weight: '700' } },
            angleLines:  { color: colors.grid },
          }
        },
        plugins: { legend: { display: false } },
        animation: { duration: 600 },
      }
    });

    updateChartComment(data);
  }

  function updateChartTheme() {
    if (!radarChart) return;
    const colors = getChartColors();
    radarChart.data.datasets[0].borderColor     = colors.line;
    radarChart.data.datasets[0].backgroundColor = colors.fill;
    radarChart.data.datasets[0].pointBackgroundColor = colors.point;
    radarChart.options.scales.r.grid.color        = colors.grid;
    radarChart.options.scales.r.pointLabels.color = colors.tick;
    radarChart.options.scales.r.angleLines.color  = colors.grid;
    radarChart.update();
  }

  function refreshChart() {
    if (!radarChart) return;
    const data = CATEGORIES.map(cat => {
      const results  = getResults(cat.key);
      const attempted= Object.keys(results).length;
      const correct  = Object.values(results).filter(r => r.correct).length;
      return attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
    });
    radarChart.data.datasets[0].data = data;
    radarChart.update();
    updateChartComment(data);
  }

  function updateChartComment(data) {
    const totalAttempted = CATEGORIES.reduce((s, cat) => {
      return s + Object.keys(getResults(cat.key)).length;
    }, 0);

    const el = document.getElementById('chart-comment');
    if (totalAttempted === 0) {
      el.textContent = '問題を解くと得意・苦手が見えてきます';
      return;
    }

    /* 最高・最低カテゴリ */
    const withData = CATEGORIES.map((cat, i) => ({ label: cat.short, val: data[i] }))
                               .filter(d => d.val > 0);
    if (withData.length === 0) { el.textContent = ''; return; }

    const best  = withData.reduce((a, b) => a.val >= b.val ? a : b);
    const worst = withData.reduce((a, b) => a.val <= b.val ? a : b);

    if (withData.length === 1) {
      el.textContent = `${best.label} の正答率: ${best.val}%`;
    } else {
      el.textContent = `得意: ${best.label} (${best.val}%)　苦手: ${worst.label} (${worst.val}%)`;
    }
  }

  /* ════════════════════════════════════════════════
     カテゴリ開始
  ════════════════════════════════════════════════ */
  function startCategory(key) {
    currentCatKey    = key;
    currentQuestions = [...(allQuestions[key] || [])];
    currentIndex     = 0;
    sessionResults   = [];
    streak           = getStreak();

    if (currentQuestions.length === 0) {
      alert('このカテゴリの問題データがありません。');
      return;
    }

    buildTabBar();
    showQuestion();
    showScreen('quiz');
  }

  /* ════════════════════════════════════════════════
     カテゴリタブ構築
  ════════════════════════════════════════════════ */
  function buildTabBar() {
    const bar = document.getElementById('tab-bar');
    bar.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (cat.key === currentCatKey ? ' active' : '');
      btn.textContent = cat.short;
      btn.addEventListener('click', () => {
        if (cat.key !== currentCatKey) startCategory(cat.key);
      });
      bar.appendChild(btn);
    });
  }

  /* ════════════════════════════════════════════════
     問題表示
  ════════════════════════════════════════════════ */
  function showQuestion() {
    const q = currentQuestions[currentIndex];
    if (!q) return;

    answered = false;
    elapsedSec = 0;
    startTimer();

    /* ヘッダー更新 */
    document.getElementById('q-current').textContent = currentIndex + 1;
    document.getElementById('q-total').textContent   = currentQuestions.length;
    document.getElementById('q-theme').textContent   = q.theme ? `📌 ${q.theme}` : '';
    document.getElementById('streak-num').textContent = streak;

    /* 進捗バー */
    const pct = Math.round(((currentIndex) / currentQuestions.length) * 100);
    document.getElementById('quiz-progress-fill').style.width = pct + '%';

    /* 本文 */
    const bodyEl   = document.getElementById('q-body');
    const dividerEl= document.getElementById('q-divider');
    if (q.body) {
      bodyEl.textContent    = q.body;
      bodyEl.style.display  = 'block';
      dividerEl.style.display = 'block';
    } else {
      bodyEl.style.display  = 'none';
      dividerEl.style.display = 'none';
    }

    /* 設問 */
    document.getElementById('q-text').textContent = q.text;

    /* 選択肢 */
    const choicesEl = document.getElementById('choices');
    choicesEl.innerHTML = '';
    q.choices.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-num">${i+1}</span><span>${c}</span>`;
      btn.addEventListener('click', () => selectChoice(i + 1, btn));
      choicesEl.appendChild(btn);
    });

    /* 応援メッセージ・解説クリア */
    document.getElementById('cheer-msg').textContent  = '';
    document.getElementById('cheer-msg').className    = 'cheer-msg';
    document.getElementById('streak-anim').textContent = '';
    document.getElementById('explain-box').classList.remove('show');
    document.getElementById('time-label').className  = 'time-label';
    document.getElementById('time-label').textContent = '';

    /* ナビゲーション */
    document.getElementById('btn-prev').disabled =
      currentIndex === 0;
    document.getElementById('btn-next').textContent =
      currentIndex === currentQuestions.length - 1 ? '結果を見る' : '次へ →';
  }
